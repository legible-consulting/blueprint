# Legible Consulting — client build template. One root, template/. The questions below decide
# what renders: a file or folder whose name carries a question renders only on yes.
_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
# A rendered repo owns its README.md, its .icm/intake/README.md (what is true of this backlog:
# the epics, the decisions of record), its CLAUDE.md and its .gitignore: the routing table and
# the ignore list grow with the code. A UAT build's .env.example is the build's own list of
# names and grows the same way. Copier writes each once and never overwrites it. Every other
# rendered file is the blueprint's: the ticket contract (.icm/intake/CONTEXT.md), the UAT
# contract, the pull request template, the guards, the scripts, the workflows.
_skip_if_exists:
  - README.md
  - .icm/intake/README.md
  - CLAUDE.md
  - .gitignore
  - "{% if uat %}.env.example{% endif %}"

slug:
  type: str
  help: Repository slug, kebab-case (becomes the folder and the GitHub repo name)
  validator: "{% if not slug | regex_search('^[a-z0-9][a-z0-9-]*$') %}kebab-case only{% endif %}"

client_name:
  type: str
  help: The client's display name as it appears in documents

language:
  type: str
  help: Language of client-facing text (BCP 47, e.g. pt-PT, en, nl, fr, de)
  default: pt-PT

monorepo:
  type: bool
  help: >-
    Is this one repository of several apps and shared packages? Yes adds the monorepo caches
    to .gitignore and an Apps and packages table to CLAUDE.md.
  default: false

release:
  type: bool
  help: >-
    Does release-please cut the releases? Yes adds the release job to ci.yml: each push to main
    opens or updates the release pull request, and Jamie's merge of that pull request is the
    release. No means production follows main and the merge of a ticket is its release.
  default: true

uat:
  type: bool
  help: >-
    Does the client sign each batch off on a UAT environment before it reaches production?
    Yes renders .icm/uat/CONTEXT.md, the scripts promote.sh, uat-db.sh and rollback.sh, the
    workflows promote.yml and neon-cleanup.yml, and .env.example: a Vercel custom environment
    `uat` deployed from main on every merge, a Neon branch `uat` for its database, and a
    promotion that is Jamie's merge of the release pull request. No means the pull request
    preview is the UAT and production follows main. Asked when release is yes.
  default: false
  when: "{{ release }}"
