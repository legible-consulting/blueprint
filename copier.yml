# Legible Consulting — client build and workspace template
_min_copier_version: "9.0.0"
_subdirectory: "templates/{{ tier }}"
_answers_file: .copier-answers.yml
# A rendered repo owns its README.md and its .icm/intake/README.md (what is true of this
# backlog: the epics, the decisions of record). An app or platform repo also owns its CLAUDE.md
# and its .gitignore: the routing table and the ignore list grow with the code, and the adopted
# repos wrote theirs by hand. Copier writes each once and never overwrites it. Every other
# rendered file is the blueprint's: the ticket contract (.icm/intake/CONTEXT.md), the pull
# request template, the guards, ci.yml.
_skip_if_exists:
  - README.md
  - .icm/intake/README.md
  - "{% if tier in ['app', 'platform'] %}CLAUDE.md{% endif %}"
  - "{% if tier in ['app', 'platform'] %}.gitignore{% endif %}"

tier:
  type: str
  help: What is being rendered?
  choices:
    site: site
    app: app
    platform: platform
    workspace: workspace
  default: site

slug:
  type: str
  help: Repository slug, kebab-case (becomes the folder and the GitHub repo name)
  validator: "{% if not slug | regex_search('^[a-z0-9][a-z0-9-]*$') %}kebab-case only{% endif %}"

client_name:
  type: str
  help: The client's display name as it appears in documents

language:
  type: str
  help: Language of client-facing text (BCP 47, e.g. pt-PT, en, nl, fr, de)
  default: pt-PT
