# Legible Consulting — client template. One root, template/. It renders a client build, or with
# workspace yes a client's ICM workspace. The questions below decide what renders: a file or
# folder whose name carries a question renders only on yes.
_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
# A rendered repo owns its README.md, its .icm/intake/README.md (what is true of this backlog:
# the epics, the decisions of record), its CLAUDE.md and its .gitignore: the routing table and
# the ignore list grow with the code. A UAT or Neon build's .env.example is the build's own
# list of names and grows the same way. Copier writes each once and never overwrites it. Every
# other rendered file is the blueprint's: the ticket contract (.icm/intake/CONTEXT.md), the UAT
# contract, the database contract, the pull request template, the guards, the scripts, the
# workflows, and a build's Emdash files (.emdash.json and .icm/scripts/worktree-setup.sh).
_skip_if_exists:
  - README.md
  - .icm/intake/README.md
  - CLAUDE.md
  - .gitignore
  - "{% if uat or database == 'neon' %}.env.example{% endif %}"
  # A workspace's stage contracts are the client's from the first coaching hour.
  - "{% if workspace %}01-collect{% endif %}/CONTEXT.md"
  - "{% if workspace %}02-draft{% endif %}/CONTEXT.md"
  - "{% if workspace %}03-deliver{% endif %}/CONTEXT.md"

slug:
  type: str
  help: Repository slug, kebab-case (becomes the folder and the GitHub repo name)
  validator: "{% if not slug | regex_search('^[a-z0-9][a-z0-9-]*$') %}kebab-case only{% endif %}"

client_name:
  type: str
  help: The client's display name as it appears in documents

language:
  type: str
  help: Language of client-facing text (BCP 47, e.g. pt-PT, en, nl, fr, de)
  default: pt-PT

workspace:
  type: bool
  help: >-
    Is this a client's ICM workspace for coaching, not a build? Yes renders CLAUDE.md as the
    workspace map, three stage folders (01-collect, 02-draft, 03-deliver) with a stub
    CONTEXT.md each, one example gate, and a ci.yml that asks check-client for the contract
    check. It renders no build file: no .icm/, no pull request template, no release job.
    monorepo, release and uat are asked only on no.
  default: false

monorepo:
  type: bool
  help: >-
    Is this one repository of several apps and shared packages? Yes adds the monorepo caches
    to .gitignore and an Apps and packages table to CLAUDE.md.
  default: false
  when: "{{ not workspace }}"

release:
  type: bool
  help: >-
    Does release-please cut the releases? Yes adds the release job to ci.yml: each push to main
    opens or updates the release pull request. On Jamie's word release, the session merges it
    with release.sh, and that merge is the release. No means production follows main and the
    merge of a ticket is its release.
  default: true
  when: "{{ not workspace }}"

uat:
  type: bool
  help: >-
    Does the client sign each batch off on a UAT environment before it reaches production?
    Yes renders .icm/uat/CONTEXT.md, the scripts promote.sh and rollback.sh, the workflow
    promote.yml, and .env.example: a Vercel custom environment `uat` deployed from main on every
    merge, a UAT database that is the build's own (database decides its files), and a promotion
    that promote.sh run dispatches with the release tag after the client's sign-off. No means the
    pull request preview is the UAT and production follows main. Asked when release is yes.
  default: false
  when: "{{ release and not workspace }}"

database:
  type: str
  help: >-
    The database the build runs on. neon renders the database contract
    (.icm/database/CONTEXT.md), the migration at build vercel-build.sh, and the setup stubs of
    the Neon projects and the Neon integration, which makes a Neon branch for each preview. Any
    other answer renders no database file, and the answer stays in .copier-answers.yml so the
    blueprint can learn what those builds need.
  choices:
    - none
    - neon
    - mongodb
    - other
  default: none
  when: "{{ not workspace }}"
