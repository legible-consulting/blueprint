# check: the blueprint's walk test. Six proof answer sets render on each pull request and on
# each push to main (five builds and one workspace), the rendered workflows, hooks and scripts are linted, and every
# functionality question is checked for a default and a help line (CI is truth; never run
# locally). The update job updates a render of v0.6.0 and of v0.8.0 to HEAD and compares the
# result with a fresh HEAD render. The ste job compares the vendored writing skill with its
# pinned commit.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The asd-ste100 commit: the writing job runs its linter, and the ste job compares the
  # template's copy with it. The same commit as the house's check.yml.
  STE_SKILL_SHA: 3944283c183eea13fe5bd902b572da3b4de8bf44

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Public repo, but the scan still runs here: nothing client-specific may enter the method.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .

  render:
    # The template renders into a scratch folder with copier, as a kickoff would, once per
    # proof answer set: every default, every yes (monorepo, release, uat, database neon), release
    # no, a workspace, neon without uat, and mongodb with uat. A build must carry the ticket
    # convention, the pull request template with both gate anchors, the three skills, a
    # CLAUDE.md under 80 lines and no BUILD.md. A uat render carries every UAT file and the
    # others none. A neon render carries every database file and the others none. A workspace carries the three stage contracts, each with
    # Inputs, Process, Outputs and status: stub, one gate, and a ci.yml that asks for the
    # contract check, and no build file. A build carries session-start.sh, registered, and it
    # prints the board of a fixture. A workspace carries neither. actionlint reads the rendered workflows and shellcheck the rendered
    # hooks and scripts, so a template error fails here and not in a client repo. In a build,
    # new-run.sh --dry-run runs on a fixture stub and must leave the tree as it was, and the
    # router passes its fixture test. neon-nouat answers db/migrations, so the proof shows that
    # the migrations_path answer gets to preview-db.yml, and not only the default.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: defaults, workspace: "false", monorepo: "false", release: "true", uat: "false", database: none, migrations_path: migrations }
          - { name: all, workspace: "false", monorepo: "true", release: "true", uat: "true", database: neon, migrations_path: migrations }
          - { name: minimal, workspace: "false", monorepo: "false", release: "false", uat: "false", database: none, migrations_path: migrations }
          - { name: workspace, workspace: "true", monorepo: "false", release: "false", uat: "false", database: none, migrations_path: migrations }
          - { name: neon-nouat, workspace: "false", monorepo: "false", release: "true", uat: "false", database: neon, migrations_path: db/migrations }
          - { name: mongodb-uat, workspace: "false", monorepo: "false", release: "true", uat: "true", database: mongodb, migrations_path: migrations }
    env:
      NAME: ${{ matrix.name }}
      WORKSPACE: ${{ matrix.workspace }}
      MONOREPO: ${{ matrix.monorepo }}
      RELEASE: ${{ matrix.release }}
      UAT: ${{ matrix.uat }}
      DATABASE: ${{ matrix.database }}
      MIGRATIONS_PATH: ${{ matrix.migrations_path }}
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install copier and actionlint
        run: |
          pipx install copier==9.19.1
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" actionlint
      - name: Render the answer set
        run: |
          copier copy --defaults --vcs-ref HEAD \
            -d slug=zz-proof -d client_name="Zz Proof" -d language=en -d "workspace=${WORKSPACE}" \
            -d "monorepo=${MONOREPO}" -d "release=${RELEASE}" -d "uat=${UAT}" \
            -d "database=${DATABASE}" -d "migrations_path=${MIGRATIONS_PATH}" \
            . "${RUNNER_TEMP}/zz-${NAME}"
      - name: The migrations_path validator refuses a bad folder
        if: matrix.name == 'all'
        # An absolute path, an empty value and a .. segment each stop the render.
        run: |
          fail=0
          for p in /migrations "" a/../b; do
            if copier copy --defaults --vcs-ref HEAD -d slug=zz-proof -d client_name="Zz Proof" \
              -d database=neon -d "migrations_path=${p}" . "${RUNNER_TEMP}/zz-bad" >/dev/null 2>&1; then
              echo "::error::migrations_path '${p}' renders, and the validator must refuse it"
              fail=1
            fi
            rm -rf "${RUNNER_TEMP}/zz-bad"
          done
          exit "$fail"
      - name: The rendered settings deny each env file by name
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A glob such as .env.* also matches .env.example, the file the kickoff and the UAT
        # setup tell a session to read. The deny list names each secret env file instead.
        run: |
          fail=0
          deny="$(jq -r '.permissions.deny[]' .claude/settings.json)" \
            || { echo "::error::${NAME}: .claude/settings.json does not parse as JSON"; exit 1; }
          grep -qxF 'Read(./**/.env.local)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list does not name .env.local"; fail=1; }
          ! grep -qF '.env.*)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list has a .env.* glob, which blocks .env.example"; fail=1; }
          exit "$fail"
      - name: The rendered build keeps the conventions
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .icm/intake/CONTEXT.md
          need .icm/intake/README.md
          need .icm/intake/_done/.gitkeep
          need .icm/intake/triage/_done/.gitkeep
          need .github/pull_request_template.md
          need .icm/scripts/new-run.sh
          need .icm/scripts/close-out.sh
          need .icm/scripts/merge.sh
          need .icm/scripts/release.sh
          # Each lane contract keeps the three sections and stays under 60 lines. A workspace
          # has no .icm, so it has no lane.
          for l in bug tweak chore hotfix; do
            f=".icm/lanes/${l}/CONTEXT.md"
            need "$f"
            [ -e "$f" ] || continue
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            n="$(wc -l < "$f")"
            [ "$n" -lt 60 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 60)"; fail=1; }
          done
          need .github/workflows/ci.yml
          need .github/workflows/gate.yml
          need .github/dependabot.yml
          grep -qF 'edited' .github/workflows/gate.yml || { echo "::error::${NAME}: gate.yml does not run on an edit of the body"; fail=1; }
          need .claude/settings.json
          # The six hooks. A workspace keeps the three guards. The router, its test and
          # session-start.sh are build-only, and each must be executable. Claude Code runs
          # session-start.sh at session start and the router on each prompt, so settings.json
          # registers the two.
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets \
            route-request route-request.test session-start; do
            need ".claude/hooks/${h}.sh"
          done
          for h in route-request route-request.test session-start; do
            f=".claude/hooks/${h}.sh"
            [ ! -e "$f" ] || [ -x "$f" ] || { echo "::error::${NAME}: ${f} is not executable"; fail=1; }
          done
          jq -e '.hooks.SessionStart[0].hooks[0].command | endswith("/.claude/hooks/session-start.sh\"")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json does not register session-start.sh"; fail=1; }
          jq -e '.hooks.UserPromptSubmit[0].hooks[0].command | contains("route-request.sh")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: settings.json does not register route-request.sh"; fail=1; }
          # The three skills. asd-ste100 is a copy of the linter's repo at the pinned commit. Each
          # written skill stays under 120 lines, and its frontmatter name equals its folder.
          for f in SKILL.md README.md LICENSE references/writing-rules.md scripts/ste-lint.py \
            examples/before-after.md examples/linter-edge-cases.md; do
            need ".claude/skills/asd-ste100/${f}"
          done
          for s in pr-conventions ticket-craft; do
            f=".claude/skills/${s}/SKILL.md"
            need "$f"
            [ -e "$f" ] || continue
            n="$(wc -l < "$f")"
            [ "$n" -lt 120 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 120)"; fail=1; }
            [ "$(head -n 1 "$f")" = '---' ] && sed -n '2,/^---$/p' "$f" | grep -qx "name: ${s}" \
              || { echo "::error::${NAME}: ${f} frontmatter lacks 'name: ${s}'"; fail=1; }
            sed -n '2,/^---$/p' "$f" | grep -q '^description: .' \
              || { echo "::error::${NAME}: ${f} frontmatter lacks a description"; fail=1; }
          done
          [ ! -e BUILD.md ] || { echo "::error::${NAME}: BUILD.md must not exist"; fail=1; }
          never() { [ ! -e "$1" ] || { echo "::error::${NAME}: $1 must not exist"; fail=1; }; }
          # want <yes> <file>: the file exists on yes and is absent on no.
          want() { if [ "$1" = true ]; then need "$2"; else never "$2"; fi; }
          neon=false; [ "$DATABASE" = neon ] && neon=true
          either=false; { [ "$UAT" = true ] || [ "$neon" = true ]; } && either=true
          for f in .icm/uat/CONTEXT.md .icm/scripts/promote.sh .icm/scripts/rollback.sh .github/workflows/promote.yml; do
            want "$UAT" "$f"
          done
          for f in .icm/database/CONTEXT.md .icm/scripts/preview-db.sh .icm/scripts/lib/neon.sh \
            .github/workflows/preview-db.yml .github/workflows/neon-cleanup.yml; do
            want "$neon" "$f"
          done
          want "$either" .icm/scripts/lib/vercel.sh
          want "$either" .env.example
          never .icm/scripts/uat-db.sh
          [ ! -e .icm/scripts/preview-db.sh ] || [ -x .icm/scripts/preview-db.sh ] \
            || { echo "::error::${NAME}: .icm/scripts/preview-db.sh is not executable"; fail=1; }
          grep -qx "database: ${DATABASE}" .copier-answers.yml \
            || { echo "::error::${NAME}: .copier-answers.yml does not keep database: ${DATABASE}"; fail=1; }
          if [ "$neon" = true ]; then
            f=.icm/database/CONTEXT.md
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            n="$(wc -l < "$f")"
            [ "$n" -lt 90 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 90)"; fail=1; }
            grep -qF "paths: [\"${MIGRATIONS_PATH}/**\"]" .github/workflows/preview-db.yml \
              || { echo "::error::${NAME}: preview-db.yml does not watch ${MIGRATIONS_PATH}/**"; fail=1; }
            grep -qF '.icm/database/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to .icm/database/CONTEXT.md"; fail=1; }
            grep -qx 'MIGRATE_AT_BUILD=' .env.example || { echo "::error::${NAME}: .env.example does not name MIGRATE_AT_BUILD"; fail=1; }
            grep -qxF "migrations_path: ${MIGRATIONS_PATH}" .copier-answers.yml \
              || { echo "::error::${NAME}: .copier-answers.yml does not keep migrations_path"; fail=1; }
          else
            ! grep -qF '.icm/database/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md routes to .icm/database/CONTEXT.md"; fail=1; }
            [ ! -e .env.example ] || ! grep -q '^NEON_\|^MIGRATE_AT_BUILD' .env.example \
              || { echo "::error::${NAME}: .env.example names a Neon variable"; fail=1; }
          fi
          if [ "$UAT" = true ]; then
            grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to .icm/uat/CONTEXT.md"; fail=1; }
            grep -qF '## Environments' README.md || { echo "::error::${NAME}: README.md has no Environments table"; fail=1; }
          else
            ! grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md routes to .icm/uat/CONTEXT.md"; fail=1; }
          fi
          if [ "$RELEASE" = true ]; then
            grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has no release job"; fail=1; }
          else
            ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          fi
          if [ "$MONOREPO" = true ]; then
            grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore lacks the monorepo caches"; fail=1; }
            grep -qF '## Apps and packages' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md has no Apps and packages table"; fail=1; }
          else
            ! grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore carries the monorepo caches"; fail=1; }
          fi
          ! grep -qF 'tier' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes a tier"; fail=1; }
          ! grep -qF 'workspace' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes workspace"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          for a in gate:spec-approved gate:ready-to-merge; do
            grep -qF "<!-- ${a} -->" .github/pull_request_template.md \
              || { echo "::error::${NAME}: pull_request_template.md lacks the ${a} anchor"; fail=1; }
          done
          # A Jinja tag opens with two braces or a brace and a percent sign. A GitHub Actions
          # expression opens with a dollar sign and two braces, and stays.
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github .icm \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          exit "$fail"
      - name: The rendered workspace keeps the conventions
        if: matrix.workspace == 'true'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          never() { [ ! -e "$1" ] || { echo "::error::${NAME}: $1 must not exist"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .github/workflows/ci.yml
          need .claude/settings.json
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets; do
            need ".claude/hooks/${h}.sh"
          done
          # A workspace has no tickets, no pull request template, no release and no ticket
          # skills: no build file.
          never .icm
          # Copier makes the empty .claude/skills folder, and git does not keep an empty folder.
          # No file under it is the check.
          [ -z "$(find .claude/skills -type f 2>/dev/null)" ] \
            || { echo "::error::${NAME}: .claude/skills holds a file"; fail=1; }
          never .github/pull_request_template.md
          never .github/workflows/gate.yml
          never .github/dependabot.yml
          never BUILD.md
          never .env.example
          never .claude/hooks/session-start.sh
          ! jq -e '.hooks | has("SessionStart")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json registers SessionStart"; fail=1; }
          never .claude/hooks/route-request.sh
          never .claude/hooks/route-request.test.sh
          jq -e '.hooks | has("UserPromptSubmit") | not' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: settings.json registers a UserPromptSubmit hook"; fail=1; }
          for d in 01-collect 02-draft 03-deliver; do
            f="${d}/CONTEXT.md"
            need "$f"
            [ -e "$f" ] || continue
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            grep -qx 'status: stub' "$f" || { echo "::error::${NAME}: ${f} is not status: stub"; fail=1; }
            grep -qF "\`${f}\`" CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to ${f}"; fail=1; }
          done
          gates="$(cat ./*/CONTEXT.md | grep -c '^- \[ \]' || true)"
          [ "$gates" -eq 1 ] || { echo "::error::${NAME}: ${gates} example gates (want 1)"; fail=1; }
          grep -qx '      workspace: true' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml does not pass workspace: true"; fail=1; }
          ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github ./*/CONTEXT.md \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          exit "$fail"
      - name: session-start.sh prints the board of a fixture
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A copy of the render gets two epics, one triage stub, an Order and two branches. The
        # hook must print the expected lines, keep the checked-out ticket started, and stay
        # quiet on stderr with no README.md, no .git or no open stub.
        run: |
          fail=0
          b="${RUNNER_TEMP}/board-${NAME}"
          cp -a . "$b"
          cd "$b"
          i=.icm/intake
          mkdir -p "$i/zz-alpha" "$i/zz-beta/_done"
          printf '# Breakdown: Zz alpha\n' > "$i/zz-alpha/breakdown.md"
          printf '# Stub: A1\n\n- feature-slug: a1\n- sequence: 2 of 3\n' > "$i/zz-alpha/a1.md"
          printf '# Stub: A2\n\n- feature-slug: a2\n- sequence: 1 of 3\n- blocked: waits on a vendor\n' > "$i/zz-alpha/a2.md"
          printf '# Stub: A3\n\n- feature-slug: a3\n' > "$i/zz-alpha/a3.md"
          printf '# Stub: B1\n\n- feature-slug: b1\n- sequence: 2 of 2\n' > "$i/zz-beta/b1.md"
          printf '# Stub: B0\n\n- feature-slug: b0\n- sequence: 1 of 2\n' > "$i/zz-beta/_done/b0.md"
          printf '# Stub: Zz fix\n\n- lane: bug\n- priority: P1\n' > "$i/triage/zz-fix.md"
          printf '\n## Order\n\nSet by Jamie on 2026-10-27.\n\n1. triage\n2. zz-alpha\n3. zz-beta\n' >> "$i/README.md"
          git init -q -b main
          git config user.name check
          git config user.email check@example.invalid
          git add -A
          git commit -q -m fixture
          # a1 is started. b0 merged and its branch stays: it is not started.
          git branch a1
          git branch b0
          want="$(cat <<'EOF'
          The board of .icm/intake/ (read-only):
            epic zz-alpha: 3 open, next: a1
            epic zz-beta: 1 open, next: b1
            triage: 1 open (bug 1)
          ## Order
          Set by Jamie on 2026-10-27.
          1. triage
          2. zz-alpha
          3. zz-beta
          Started tickets:
            zz-alpha/a1 on branch a1
          5 open stubs in total. Planning lives in .icm/intake/, never in a loose TODO.md.
          EOF
          )"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>"${b}.err")" \
            || { echo "::error::${NAME}: session-start.sh exits non-zero"; fail=1; }
          [ "$got" = "$want" ] || { echo "::error::${NAME}: session-start.sh prints other lines"; diff <(echo "$want") <(echo "$got"); fail=1; }
          # On the ticket's branch the stub is in _done/, and the ticket stays started.
          git switch -q a1
          mkdir -p "$i/zz-alpha/_done"
          git mv "$i/zz-alpha/a1.md" "$i/zz-alpha/_done/a1.md"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")"
          grep -qxF '  zz-alpha/a1 on branch a1' <<<"$got" || { echo "::error::${NAME}: the checked-out ticket is not started"; fail=1; }
          grep -qxF '  epic zz-alpha: 2 open, next: a3' <<<"$got" || { echo "::error::${NAME}: the next stub on the branch is wrong"; fail=1; }
          # No README.md and no .git: the board still prints, with no error.
          rm -rf .git "$i/README.md"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")" \
            || { echo "::error::${NAME}: session-start.sh fails with no .git"; fail=1; }
          ! grep -qF 'Started' <<<"$got" || { echo "::error::${NAME}: a ticket is started with no .git"; fail=1; }
          ! grep -qxF '## Order' <<<"$got" || { echo "::error::${NAME}: an Order prints with no README.md"; fail=1; }
          # No open stub: silent.
          rm -rf "$i/zz-alpha" "$i/zz-beta" "$i/triage/zz-fix.md"
          [ -z "$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")" ] \
            || { echo "::error::${NAME}: session-start.sh prints with no open stub"; fail=1; }
          [ ! -s "${b}.err" ] || { echo "::error::${NAME}: session-start.sh writes to stderr"; cat "${b}.err"; fail=1; }
          exit "$fail"
      - name: new-run.sh --dry-run changes nothing
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The rendered folder becomes a git repo with one fixture stub committed. A gh that exits
        # 99 goes first on PATH, so a dry run that calls gh fails here. Then a triage stub stays
        # untracked, as a lane leaves it, for a dry run with --ready.
        run: |
          fail=0
          git init -q -b main
          git config user.name check
          git config user.email check@example.invalid
          git add -A
          git commit -q -m render
          mkdir -p .icm/intake/zz-epic
          cat > .icm/intake/zz-epic/zz-stub.md <<'EOF'
          # Stub: Zz proof stub

          - feature-slug: zz-stub
          - epic: zz-epic
          - sequence: 1 of 1
          - depends-on: none
          - complexity: medium
          - priority: P2

          ## Problem

          The proof needs a stub.

          ## Acceptance criteria

          - [ ] zz criterion one
          - [ ] zz criterion two

          ## Out of scope

          - Nothing.
          EOF
          git add .icm/intake/zz-epic/zz-stub.md
          git commit -q -m stub
          nogh="${RUNNER_TEMP}/nogh-${NAME}"
          mkdir -p "$nogh"
          printf '#!/bin/sh\necho "gh was called" >&2\nexit 99\n' > "${nogh}/gh"
          chmod +x "${nogh}/gh"
          before="$(git rev-parse HEAD)"
          out="$(PATH="${nogh}:${PATH}" bash .icm/scripts/new-run.sh zz-epic/zz-stub --dry-run)" \
            || { echo "::error::${NAME}: the dry run of zz-epic/zz-stub failed"; fail=1; }
          for l in 'branch: zz-stub' 'pull request: draft' '<!-- gate:spec-approved -->' \
            '- ticket: `.icm/intake/zz-epic/zz-stub.md`' '- [ ] zz criterion one' '- [ ] zz criterion two'; do
            grep -qxF -- "$l" <<<"$out" || { echo "::error::${NAME}: the dry run does not print '${l}'"; fail=1; }
          done
          [ -z "$(git status --porcelain)" ] || { echo "::error::${NAME}: the dry run changed the working tree"; fail=1; }
          [ "$(git rev-parse HEAD)" = "$before" ] || { echo "::error::${NAME}: the dry run made a commit"; fail=1; }
          ! git show-ref --verify --quiet refs/heads/zz-stub || { echo "::error::${NAME}: the dry run made a branch"; fail=1; }
          cat > .icm/intake/triage/zz-fix.md <<'EOF'
          # Stub: Zz proof fix

          - lane: hotfix
          - found-by: check.yml · 2026-10-27
          - complexity: low
          - priority: P0

          ## Problem

          The proof needs a triage stub.

          ## Proposed change

          None.

          ## Acceptance criteria

          - [ ] zz fix criterion
          EOF
          st="$(git status --porcelain --untracked-files=all)"
          out="$(PATH="${nogh}:${PATH}" bash .icm/scripts/new-run.sh triage/zz-fix --ready --dry-run)" \
            || { echo "::error::${NAME}: the dry run of triage/zz-fix failed"; fail=1; }
          for l in 'branch: triage/zz-fix' 'pull request: ready' '- [ ] zz fix criterion'; do
            grep -qxF -- "$l" <<<"$out" || { echo "::error::${NAME}: the triage dry run does not print '${l}'"; fail=1; }
          done
          ! grep -qF 'Spec approved' <<<"$out" || { echo "::error::${NAME}: the triage dry run keeps the Spec approved gate"; fail=1; }
          [ "$(git status --porcelain --untracked-files=all)" = "$st" ] || { echo "::error::${NAME}: the triage dry run changed the working tree"; fail=1; }
          exit "$fail"
      - name: The router passes its fixture test
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The test builds its own fixture trees, so the rendered build's .icm/intake/ does not
        # count. Each hook call must take less than 100 ms.
        run: bash .claude/hooks/route-request.test.sh
      - name: actionlint on the rendered workflows
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The rendered folder is not a git repo, so the files are named instead of found.
        run: |
          "${GITHUB_WORKSPACE}/actionlint" -color .github/workflows/*.yml
      - name: shellcheck on the rendered hooks and scripts
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A workspace has no .icm/scripts: only the folders the render has are read.
        run: |
          dirs=(.claude/hooks)
          [ -d .icm/scripts ] && dirs+=(.icm/scripts)
          find "${dirs[@]}" -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  update:
    # copier update from an older tag to HEAD, as a live repo takes a new tag. from-v0.6.0 starts
    # in the layout of templates/{{ tier }}. from-v0.8.0 starts in the bank before workspace and
    # database, with UAT, and updates to neon. copier renders the old tag with the old answers
    # and HEAD with the new answers, and applies the difference. After the update: no conflict
    # marker remains, _commit is HEAD's, the files equal a fresh HEAD render with the same
    # answers in content and executable bit, no file of the old render stays that HEAD does not
    # render, and each written-once file keeps the old render's content. A failure names the
    # file. The tag v1.0.0 waits on this job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: from-v0.6.0
            ref: v0.6.0
            old_answers: tier=app
            new_answers: workspace=false monorepo=false release=true uat=false database=none
          - name: from-v0.8.0
            ref: v0.8.0
            old_answers: monorepo=false release=true uat=true
            new_answers: workspace=false monorepo=false release=true uat=true database=neon migrations_path=migrations
    env:
      NAME: ${{ matrix.name }}
      REF: ${{ matrix.ref }}
      OLD_ANSWERS: slug=zz client_name=Zz language=en ${{ matrix.old_answers }}
      NEW_ANSWERS: slug=zz client_name=Zz language=en ${{ matrix.new_answers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # copier reads the tags. Nothing is written into this folder, so copier sees a clean
          # template.
          fetch-depth: 0
          persist-credentials: false
      - name: Install copier
        # The version of the render job.
        run: pipx install copier==9.19.1
      - name: Render the old tag and commit it
        # The source is an absolute path: copier update reads it from _src_path and runs in
        # the rendered folder. copier update refuses a folder that is not a clean git repo.
        run: |
          d=()
          for a in $OLD_ANSWERS; do d+=(-d "$a"); done
          old="${RUNNER_TEMP}/old"
          copier copy --defaults --vcs-ref "$REF" "${d[@]}" "$GITHUB_WORKSPACE" "$old"
          cp -a "$old" "${RUNNER_TEMP}/snapshot"
          git -C "$old" init -q -b main
          git -C "$old" config user.name check
          git -C "$old" config user.email check@example.invalid
          git -C "$old" add -A
          git -C "$old" commit -q -m "render ${REF}"
      - name: Update to HEAD
        working-directory: ${{ runner.temp }}/old
        run: |
          d=()
          for a in $NEW_ANSWERS; do d+=(-d "$a"); done
          copier update --defaults --vcs-ref HEAD --conflict inline "${d[@]}"
      - name: Render HEAD with the same answers
        # The reference.
        run: |
          d=()
          for a in $NEW_ANSWERS; do d+=(-d "$a"); done
          copier copy --defaults --vcs-ref HEAD "${d[@]}" "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/ref"
      - name: The update equals a fresh HEAD render
        run: |
          fail=0
          up="${RUNNER_TEMP}/old"
          ref="${RUNNER_TEMP}/ref"
          snap="${RUNNER_TEMP}/snapshot"
          err() { echo "::error::${NAME}: $1"; fail=1; }
          # The written-once files. Each name must be in _skip_if_exists, with its Jinja
          # condition removed, so a change to that list fails here.
          once=(README.md .icm/intake/README.md CLAUDE.md .gitignore .env.example)
          skip="$(yq '._skip_if_exists[]' copier.yml | sed -E 's/\{%[^%]*%\}//g')"
          for f in "${once[@]}"; do
            grep -qxF "$f" <<<"$skip" || { echo "::error file=copier.yml::${NAME}: _skip_if_exists does not name ${f}"; fail=1; }
          done
          # A written-once file that the old render has stays as it was, and is not compared
          # with HEAD. One that the old render does not have is compared like any other file.
          kept=()
          for f in "${once[@]}"; do
            if [ -e "${snap}/${f}" ]; then kept+=("$f"); fi
          done
          for f in "${kept[@]}"; do
            if [ ! -e "${up}/${f}" ]; then
              err "the update deleted the written-once file ${f}"
            elif ! cmp -s "${snap}/${f}" "${up}/${f}"; then
              err "the update changed the written-once file ${f}"
            fi
          done
          echo "Written-once files kept: ${kept[*]}"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "a conflict marker remains in ${f#"${up}/"}"
          done < <(grep -rlE --exclude-dir=.git '^(<<<<<<<|>>>>>>>)' "$up" || true)
          a="$(yq '._commit' "${up}/.copier-answers.yml")"
          b="$(yq '._commit' "${ref}/.copier-answers.yml")"
          if [ -z "$a" ] || [ "$a" = null ] || [ "$a" != "$b" ]; then
            err ".copier-answers.yml has _commit '${a}', and a HEAD render has '${b}'"
          fi
          # Paths, not diff -r -x: diff -x README.md also skips each other README.md, such as
          # the one in .claude/skills/asd-ste100/.
          out="$(printf '%s\n' .copier-answers.yml "${kept[@]}")"
          files() {
            (cd "$1" && find . -path ./.git -prune -o \( -type f -o -type l \) -print) \
              | sed 's|^\./||' | grep -vxFf <(echo "$out") | LC_ALL=C sort || true
          }
          fu="$(files "$up")"
          fr="$(files "$ref")"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "${f} is a file of the old render that HEAD does not render"
          done < <(LC_ALL=C comm -23 <(echo "$fu") <(echo "$fr"))
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "${f} is a file that the update did not render"
          done < <(LC_ALL=C comm -13 <(echo "$fu") <(echo "$fr"))
          n=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            n=$((n + 1))
            echo "compare ${f}"
            if ! cmp -s "${up}/${f}" "${ref}/${f}"; then
              err "${f} is not the same as in a fresh HEAD render"
              diff -u "${ref}/${f}" "${up}/${f}" | head -n 40 || true
            fi
            xu=no; xr=no
            if [ -x "${up}/${f}" ]; then xu=yes; fi
            if [ -x "${ref}/${f}" ]; then xr=yes; fi
            [ "$xu" = "$xr" ] || err "${f} is executable: ${xu} after the update, ${xr} in a fresh HEAD render"
          done < <(LC_ALL=C comm -12 <(echo "$fu") <(echo "$fr"))
          echo "Compared ${n} files."
          [ "$n" -gt 0 ] || err "no file was compared"
          exit "$fail"

  ste:
    # The template's asd-ste100 is a copy of the linter's repo at STE_SKILL_SHA, and no file in
    # it is edited. A difference fails here and shows the diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the skill at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill "${RUNNER_TEMP}/ste"
          git -C "${RUNNER_TEMP}/ste" checkout -q "$STE_SKILL_SHA"
      - name: The vendored copy equals the pinned commit
        run: |
          diff -r -x .git "${RUNNER_TEMP}/ste" "template/.claude/skills/{% if not workspace %}asd-ste100{% endif %}" \
            || { echo "::error::the vendored asd-ste100 is not the same as ${STE_SKILL_SHA}"; exit 1; }

  questions:
    # Every functionality question (type bool) carries a default and a help line, so a kickoff
    # can answer with the defaults and a reader knows what yes buys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each bool question has a default and a help line
        run: |
          fail=0
          while IFS= read -r q; do
            [ -n "$q" ] || continue
            yq -e ".\"$q\" | has(\"default\") and has(\"help\")" copier.yml >/dev/null 2>&1 \
              || { echo "::error file=copier.yml::question $q lacks a default or a help line"; fail=1; }
            echo "$q: default $(yq ".\"$q\".default" copier.yml)"
          done < <(yq 'to_entries | .[] | select(.value | type == "!!map" and .type == "bool") | .key' copier.yml)
          exit "$fail"

  writing:
    # Simplified Technical English as advice: every finding in the job log and in the run
    # summary, never a failure.
    # The same linter commit as the house's check.yml. The template's copy of the linter's repo
    # is skipped: its examples hold bad text on purpose, and no file in the copy is edited.
    # STE_SKILL_SHA is in the workflow's env, so the ste job reads the same commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the linter at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill /tmp/ste
          git -C /tmp/ste checkout -q "$STE_SKILL_SHA"
      - name: Lint every markdown file, as advice
        run: |
          out="$(git ls-files -z '*.md' '*.md.jinja' ':!:template/.claude/skills/*asd-ste100*' | xargs -0 python3 -I /tmp/ste/scripts/ste-lint.py 2>&1 || true)"
          { echo '## Simplified Technical English (advice)'; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
