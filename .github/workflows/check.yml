# check: the blueprint's walk test. Six proof answer sets render on each pull request and on
# each push to main (five builds and one workspace), the rendered workflows, hooks and scripts are linted, and every
# functionality question is checked for a default and a help line (CI is truth; never run
# locally). The update job updates a render of v0.6.0 and of v0.8.0 to HEAD and compares the
# result with a fresh HEAD render. The ste job compares the vendored writing skill with its
# pinned commit.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The asd-ste100 commit: the writing job runs its linter, and the ste job compares the
  # template's copy with it. The same commit as the house's check.yml.
  STE_SKILL_SHA: 3944283c183eea13fe5bd902b572da3b4de8bf44

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Public repo, but the scan still runs here: nothing client-specific may enter the method.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .

  render:
    # The template renders into a scratch folder with copier, as a kickoff would, once per
    # proof answer set: every default, every yes (monorepo, release, uat, database neon), release
    # no, a workspace, neon without uat, and mongodb with uat. A build must carry the ticket
    # convention, the pull request template with both gate anchors, the three skills, a
    # CLAUDE.md under 80 lines, no BUILD.md, and README.md § Environments with five columns, a
    # UAT row on uat yes only, and the Database and Moves on cells that the answers decide. A
    # workspace has no such table. A uat render carries every UAT file and the
    # others none. A neon render carries every database file and the others none. Each build
    # carries the setup stubs its answers ask for, and no other. A workspace carries the three stage contracts, each with
    # Inputs, Process, Outputs and status: stub, one gate, and a ci.yml that asks for the
    # contract check, and no build file. A build carries session-start.sh, registered, and it
    # prints the board of a fixture. A workspace carries neither. actionlint reads the rendered workflows and shellcheck the rendered
    # hooks and scripts, so a template error fails here and not in a client repo. In a build,
    # new-run.sh --dry-run runs on a fixture stub and must leave the tree as it was, merge.sh
    # keeps each refusal against a fake gh that serves REST only, and the router passes its
    # fixture test. The git-writes guard asks before a REST merge or ref delete, and stays
    # silent for merge.sh and a read. In `all`, a monorepo with UAT and Neon, rollback.sh runs
    # against a fake Vercel API with two UAT projects, and acts on those two only, and a copier
    # update keeps a done setup stub done. No rendered file names VERCEL_PROJECT,
    # NEON_PROJECT_ID, NEON_API_KEY or MIGRATE_AT_BUILD. In each neon build, vercel-build.sh
    # migrates on the right environments against a fake npm. In a monorepo with Neon, the
    # contract's buildCommand migrates before turbo starts, in a fixture Turborepo.
    # In a build, .emdash.json parses with jq, runs the install through scripts.prepare, and
    # keeps preservePatterns with .env and .env.local and nothing else. Each entry is a literal
    # path that git check-ignore ignores in the render. A workspace has neither .emdash.json
    # nor the setup script.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: defaults, workspace: "false", monorepo: "false", release: "true", uat: "false", database: none }
          - { name: all, workspace: "false", monorepo: "true", release: "true", uat: "true", database: neon }
          - { name: minimal, workspace: "false", monorepo: "false", release: "false", uat: "false", database: none }
          - { name: workspace, workspace: "true", monorepo: "false", release: "false", uat: "false", database: none }
          - { name: neon-nouat, workspace: "false", monorepo: "false", release: "true", uat: "false", database: neon }
          - { name: mongodb-uat, workspace: "false", monorepo: "false", release: "true", uat: "true", database: mongodb }
    env:
      NAME: ${{ matrix.name }}
      WORKSPACE: ${{ matrix.workspace }}
      MONOREPO: ${{ matrix.monorepo }}
      RELEASE: ${{ matrix.release }}
      UAT: ${{ matrix.uat }}
      DATABASE: ${{ matrix.database }}
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install copier and actionlint
        run: |
          pipx install copier==9.19.1
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" actionlint
      - name: Render the answer set
        run: |
          copier copy --defaults --vcs-ref HEAD \
            -d slug=zz-proof -d client_name="Zz Proof" -d language=en -d "workspace=${WORKSPACE}" \
            -d "monorepo=${MONOREPO}" -d "release=${RELEASE}" -d "uat=${UAT}" \
            -d "database=${DATABASE}" . "${RUNNER_TEMP}/zz-${NAME}"
      - name: The rendered settings deny each env file by name
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A glob such as .env.* also matches .env.example, the file the kickoff and the UAT
        # setup tell a session to read. The deny list names each secret env file instead.
        run: |
          fail=0
          deny="$(jq -r '.permissions.deny[]' .claude/settings.json)" \
            || { echo "::error::${NAME}: .claude/settings.json does not parse as JSON"; exit 1; }
          grep -qxF 'Read(./**/.env.local)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list does not name .env.local"; fail=1; }
          ! grep -qF '.env.*)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list has a .env.* glob, which blocks .env.example"; fail=1; }
          [ "$(grep -c . <<<"$deny")" -eq 12 ] \
            || { echo "::error::${NAME}: the deny list has $(grep -c . <<<"$deny") rules, not 12"; fail=1; }
          exit "$fail"
      - name: The Emdash files are in a build and in no workspace
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # Emdash reads .emdash.json when it makes a task worktree. A template error must fail
        # here and not in a client repo. The setup script is not run: a proof render has no lockfile.
        run: |
          fail=0
          if [ "${WORKSPACE}" = "true" ]; then
            for f in .emdash.json .icm/scripts/worktree-setup.sh; do
              [ ! -e "$f" ] || { echo "::error::${NAME}: $f must not exist in a workspace"; fail=1; }
            done
            exit "$fail"
          fi
          jq -e . .emdash.json >/dev/null \
            || { echo "::error::${NAME}: .emdash.json does not parse as JSON"; exit 1; }
          [ "$(jq -r '.scripts.prepare' .emdash.json)" = "bash .icm/scripts/worktree-setup.sh" ] \
            || { echo "::error::${NAME}: scripts.prepare is not 'bash .icm/scripts/worktree-setup.sh'"; fail=1; }
          [ -x .icm/scripts/worktree-setup.sh ] \
            || { echo "::error::${NAME}: .icm/scripts/worktree-setup.sh is missing or not executable"; fail=1; }
          jq -e '(.preservePatterns | sort) == [".env", ".env.local"]' .emdash.json >/dev/null \
            || { echo "::error::${NAME}: preservePatterns is not exactly .env and .env.local"; fail=1; }
          # git check-ignore needs a repository, and the render is not one. A scratch repository
          # takes the rendered .gitignore.
          repo="$(mktemp -d)"
          git init -q "$repo"
          cp .gitignore "$repo/.gitignore"
          while IFS= read -r p; do
            case "$p" in
              *[\*\?\[\]\{\}!]* | /* | ./* | */)
                echo "::error::${NAME}: preservePatterns entry '${p}' is not a literal path"; fail=1; continue ;;
            esac
            git -C "$repo" check-ignore -q -- "$p" \
              || { echo "::error::${NAME}: preservePatterns entry '${p}' is not ignored by .gitignore"; fail=1; }
          done < <(jq -r '.preservePatterns[]' .emdash.json)
          exit "$fail"
      - name: The rendered build keeps the conventions
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .icm/intake/CONTEXT.md
          need .icm/intake/README.md
          need .icm/intake/_done/.gitkeep
          need .icm/intake/triage/_done/.gitkeep
          need .github/pull_request_template.md
          need .icm/scripts/new-run.sh
          need .icm/scripts/close-out.sh
          need .icm/scripts/merge.sh
          need .icm/scripts/release.sh
          need .icm/scripts/checks.sh
          need .icm/scripts/lib/github.sh
          for f in new-run close-out merge release checks; do
            [ ! -e ".icm/scripts/${f}.sh" ] || [ -x ".icm/scripts/${f}.sh" ] \
              || { echo "::error::${NAME}: .icm/scripts/${f}.sh is not executable"; fail=1; }
          done
          # A Claude Code cloud session gets HTTP 403 on GraphQL. The scripts use gh api, the
          # REST API, only. A comment line may name the commands.
          ! grep -rnE '^[^#]*gh (pr |release list|repo view)' .icm/scripts/ \
            || { echo "::error::${NAME}: a script in .icm/scripts/ calls GraphQL through gh"; fail=1; }
          # Each lane contract keeps the three sections and stays under 60 lines. A workspace
          # has no .icm, so it has no lane.
          for l in bug tweak chore hotfix; do
            f=".icm/lanes/${l}/CONTEXT.md"
            need "$f"
            [ -e "$f" ] || continue
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            n="$(wc -l < "$f")"
            [ "$n" -lt 60 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 60)"; fail=1; }
          done
          need .github/workflows/ci.yml
          need .github/workflows/gate.yml
          need .github/dependabot.yml
          grep -qF 'edited' .github/workflows/gate.yml || { echo "::error::${NAME}: gate.yml does not run on an edit of the body"; fail=1; }
          need .claude/settings.json
          # The six hooks. A workspace keeps the three guards. The router, its test and
          # session-start.sh are build-only, and each must be executable. Claude Code runs
          # session-start.sh at session start and the router on each prompt, so settings.json
          # registers the two.
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets \
            route-request route-request.test session-start; do
            need ".claude/hooks/${h}.sh"
          done
          for h in route-request route-request.test session-start; do
            f=".claude/hooks/${h}.sh"
            [ ! -e "$f" ] || [ -x "$f" ] || { echo "::error::${NAME}: ${f} is not executable"; fail=1; }
          done
          jq -e '.hooks.SessionStart[0].hooks[0].command | endswith("/.claude/hooks/session-start.sh\"")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json does not register session-start.sh"; fail=1; }
          jq -e '.hooks.UserPromptSubmit[0].hooks[0].command | contains("route-request.sh")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: settings.json does not register route-request.sh"; fail=1; }
          # The allow list names the two scripts that merge, and nothing else. Auto mode then
          # runs them after the tick or Jamie's word. Each script carries its gate.
          jq -e '.permissions.allow == ["Bash(.icm/scripts/merge.sh *)", "Bash(.icm/scripts/release.sh)", "Bash(.icm/scripts/release.sh *)"]' \
            .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json does not allow exactly merge.sh and release.sh"; fail=1; }
          # The three skills. asd-ste100 is a copy of the linter's repo at the pinned commit. Each
          # written skill stays under 120 lines, and its frontmatter name equals its folder.
          for f in SKILL.md README.md LICENSE references/writing-rules.md scripts/ste-lint.py \
            examples/before-after.md examples/linter-edge-cases.md; do
            need ".claude/skills/asd-ste100/${f}"
          done
          for s in pr-conventions ticket-craft; do
            f=".claude/skills/${s}/SKILL.md"
            need "$f"
            [ -e "$f" ] || continue
            n="$(wc -l < "$f")"
            [ "$n" -lt 120 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 120)"; fail=1; }
            [ "$(head -n 1 "$f")" = '---' ] && sed -n '2,/^---$/p' "$f" | grep -qx "name: ${s}" \
              || { echo "::error::${NAME}: ${f} frontmatter lacks 'name: ${s}'"; fail=1; }
            sed -n '2,/^---$/p' "$f" | grep -q '^description: .' \
              || { echo "::error::${NAME}: ${f} frontmatter lacks a description"; fail=1; }
          done
          [ ! -e BUILD.md ] || { echo "::error::${NAME}: BUILD.md must not exist"; fail=1; }
          never() { [ ! -e "$1" ] || { echo "::error::${NAME}: $1 must not exist"; fail=1; }; }
          # want <yes> <file>: the file exists on yes and is absent on no.
          want() { if [ "$1" = true ]; then need "$2"; else never "$2"; fi; }
          neon=false; [ "$DATABASE" = neon ] && neon=true
          either=false; { [ "$UAT" = true ] || [ "$neon" = true ]; } && either=true
          for f in .icm/uat/CONTEXT.md .icm/scripts/promote.sh .icm/scripts/rollback.sh .github/workflows/promote.yml; do
            want "$UAT" "$f"
          done
          for f in .icm/database/CONTEXT.md .icm/scripts/vercel-build.sh; do
            want "$neon" "$f"
          done
          want "$UAT" .icm/scripts/lib/vercel.sh
          want "$either" .env.example
          # The integration makes the preview branches: no script or workflow of the build does.
          for f in .icm/scripts/uat-db.sh .icm/scripts/preview-db.sh .icm/scripts/lib/neon.sh \
            .github/workflows/preview-db.yml .github/workflows/neon-cleanup.yml; do
            never "$f"
          done
          [ ! -e .icm/scripts/vercel-build.sh ] || [ -x .icm/scripts/vercel-build.sh ] \
            || { echo "::error::${NAME}: .icm/scripts/vercel-build.sh is not executable"; fail=1; }
          # The setup stubs: one for each act that the answers ask for, and no other.
          db=false; [ "$DATABASE" != none ] && db=true
          uatdb=false; [ "$UAT" = true ] && [ "$db" = true ] && uatdb=true
          uatneon=false; [ "$UAT" = true ] && [ "$neon" = true ] && uatneon=true
          st=.icm/intake/setup
          for a in vercel-uat-environment actions-vercel uat-variables; do want "$UAT" "${st}/${a}.md"; done
          want "$uatdb" "${st}/actions-production-database.md"
          for a in neon-projects neon-vercel-integration github-delete-head-branches; do want "$neon" "${st}/${a}.md"; done
          want "$uatneon" "${st}/uat-database.md"
          [ "$either" = true ] || never "$st"
          for f in "$st"/*.md; do
            [ -e "$f" ] || continue
            a="$(basename "$f" .md)"
            head -n 1 "$f" | grep -q '^# Setup: .' || { echo "::error::${NAME}: ${f} has no '# Setup:' title"; fail=1; }
            grep -qx -- "- setup-slug: ${a}" "$f" || { echo "::error::${NAME}: ${f} lacks '- setup-slug: ${a}'"; fail=1; }
            for sec in Why Steps 'Done when'; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            grep -q -- '^- \[ \] ' "$f" || { echo "::error::${NAME}: ${f} has no Done when box"; fail=1; }
          done
          grep -qx "database: ${DATABASE}" .copier-answers.yml \
            || { echo "::error::${NAME}: .copier-answers.yml does not keep database: ${DATABASE}"; fail=1; }
          if [ "$neon" = true ]; then
            f=.icm/database/CONTEXT.md
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            n="$(wc -l < "$f")"
            [ "$n" -lt 90 ] || { echo "::error::${NAME}: ${f} has ${n} lines (limit 90)"; fail=1; }
            grep -qF '.icm/database/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to .icm/database/CONTEXT.md"; fail=1; }
            grep -qx 'DATABASE_URL=' .env.example || { echo "::error::${NAME}: .env.example does not name DATABASE_URL"; fail=1; }
            grep -qxF '"vercel-build": "bash .icm/scripts/vercel-build.sh next build"' "$f" \
              || { echo "::error::${NAME}: ${f} lacks the vercel-build line that calls the script"; fail=1; }
            grep -qF 'advisory lock' "$f" || { echo "::error::${NAME}: ${f} does not name the advisory lock of db:migrate"; fail=1; }
          else
            ! grep -qF '.icm/database/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md routes to .icm/database/CONTEXT.md"; fail=1; }
            [ ! -e .env.example ] || ! grep -q '^DATABASE_URL' .env.example \
              || { echo "::error::${NAME}: .env.example names a Neon variable"; fail=1; }
          fi
          if [ "$UAT" = true ]; then
            grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to .icm/uat/CONTEXT.md"; fail=1; }
          else
            ! grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md routes to .icm/uat/CONTEXT.md"; fail=1; }
          fi
          # README.md § Environments: the one home of where the build runs. Five columns. One
          # Production row and one Preview row, and one UAT row with uat yes only. The Database
          # cells name the Neon projects on neon and say none on none. Moves on follows the
          # answers release and uat.
          grep -qx '## Environments' README.md || { echo "::error::${NAME}: README.md has no Environments section"; fail=1; }
          grep -qxF '| Environment | Address | Vercel project | Database | Moves on |' README.md \
            || { echo "::error::${NAME}: README.md Environments lacks the five columns"; fail=1; }
          rows() { grep -c "^| $1 | " README.md || true; }
          [ "$(rows Production)" = 1 ] || { echo "::error::${NAME}: README.md has $(rows Production) Production rows (want 1)"; fail=1; }
          [ "$(rows Preview)" = 1 ] || { echo "::error::${NAME}: README.md has $(rows Preview) Preview rows (want 1)"; fail=1; }
          if [ "$UAT" = true ]; then want_uat=1; else want_uat=0; fi
          [ "$(rows UAT)" = "$want_uat" ] || { echo "::error::${NAME}: README.md has $(rows UAT) UAT rows (want ${want_uat})"; fail=1; }
          # cell <environment> <column number>: the trimmed cell of that row.
          cell() { grep "^| $1 | " README.md | head -n 1 | awk -F' [|] ' -v c="$2" '{ sub(/ [|]$/, ""); print $c }'; }
          envs=(Production Preview); [ "$UAT" = true ] && envs+=(UAT)
          if [ "$DATABASE" = none ]; then
            for e in "${envs[@]}"; do
              [ "$(cell "$e" 4)" = none ] || { echo "::error::${NAME}: the ${e} Database cell is '$(cell "$e" 4)', not 'none'"; fail=1; }
            done
          fi
          if [ "$neon" = true ]; then
            [ "$(cell Production 4)" = 'the default branch of the Neon project `zz-proof`' ] \
              || { echo "::error::${NAME}: the Production Database cell does not name the Neon project zz-proof"; fail=1; }
            [ "$UAT" != true ] || [ "$(cell UAT 4)" = 'the default branch of the Neon project `uat-zz-proof`' ] \
              || { echo "::error::${NAME}: the UAT Database cell does not name the Neon project uat-zz-proof"; fail=1; }
            if [ "$UAT" = true ]; then p='uat-zz-proof'; else p='zz-proof'; fi
            grep -qF "in \`${p}\`," <<<"$(cell Preview 4)" \
              || { echo "::error::${NAME}: the Preview Database cell does not name the Neon project ${p}"; fail=1; }
          fi
          m="$(cell Production 5)"
          if [ "$UAT" = true ]; then
            grep -qF 'promote.sh run --tag' <<<"$m" || { echo "::error::${NAME}: Production does not move on promote.sh run: '${m}'"; fail=1; }
            [ "$(cell UAT 5)" = 'every merge to `main`' ] || { echo "::error::${NAME}: UAT does not move on every merge to main"; fail=1; }
          else
            grep -qF 'every merge to `main`' <<<"$m" || { echo "::error::${NAME}: Production does not move on every merge to main: '${m}'"; fail=1; }
          fi
          [ "$(cell Preview 5)" = 'every push to the branch' ] || { echo "::error::${NAME}: Preview does not move on every push to the branch"; fail=1; }
          if [ "$RELEASE" = true ]; then
            grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has no release job"; fail=1; }
          else
            ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          fi
          if [ "$MONOREPO" = true ]; then
            grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore lacks the monorepo caches"; fail=1; }
            grep -qF '## Apps and packages' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md has no Apps and packages table"; fail=1; }
          else
            ! grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore carries the monorepo caches"; fail=1; }
          fi
          ! grep -qF 'tier' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes a tier"; fail=1; }
          ! grep -qF 'workspace' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes workspace"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          for a in gate:spec-approved gate:ready-to-merge; do
            grep -qF "<!-- ${a} -->" .github/pull_request_template.md \
              || { echo "::error::${NAME}: pull_request_template.md lacks the ${a} anchor"; fail=1; }
          done
          # A Jinja tag opens with two braces or a brace and a percent sign. A GitHub Actions
          # expression opens with a dollar sign and two braces, and stays.
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github .icm \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          # No variable names a Vercel project or a Neon project: the scripts find them. No
          # rendered file reads a Neon key or a migration flag: the integration and the build
          # decide.
          scan=(.github .icm)
          [ ! -e .env.example ] || scan+=(.env.example)
          ! grep -rqE 'VERCEL_PROJECT|NEON_PROJECT_ID|NEON_API_KEY|MIGRATE_AT_BUILD' "${scan[@]}" \
            || { echo "::error::${NAME}: a rendered file names VERCEL_PROJECT, NEON_PROJECT_ID, NEON_API_KEY or MIGRATE_AT_BUILD"; fail=1; }
          if [ "$UAT" = true ]; then
            grep -qx 'VERCEL_TOKEN=' .env.example || { echo "::error::${NAME}: .env.example does not name VERCEL_TOKEN"; fail=1; }
          else
            [ ! -e .env.example ] || ! grep -q '^VERCEL_' .env.example \
              || { echo "::error::${NAME}: .env.example names a Vercel variable without UAT"; fail=1; }
          fi
          exit "$fail"
      - name: The rendered workspace keeps the conventions
        if: matrix.workspace == 'true'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          never() { [ ! -e "$1" ] || { echo "::error::${NAME}: $1 must not exist"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .github/workflows/ci.yml
          need .claude/settings.json
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets; do
            need ".claude/hooks/${h}.sh"
          done
          # A workspace has no tickets, no pull request template, no release and no ticket
          # skills: no build file.
          never .icm
          # Copier makes the empty .claude/skills folder, and git does not keep an empty folder.
          # No file under it is the check.
          [ -z "$(find .claude/skills -type f 2>/dev/null)" ] \
            || { echo "::error::${NAME}: .claude/skills holds a file"; fail=1; }
          never .github/pull_request_template.md
          never .github/workflows/gate.yml
          never .github/dependabot.yml
          never BUILD.md
          never .env.example
          never .claude/hooks/session-start.sh
          ! jq -e '.hooks | has("SessionStart")' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json registers SessionStart"; fail=1; }
          never .claude/hooks/route-request.sh
          never .claude/hooks/route-request.test.sh
          jq -e '.hooks | has("UserPromptSubmit") | not' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: settings.json registers a UserPromptSubmit hook"; fail=1; }
          jq -e '.permissions | has("allow") | not' .claude/settings.json >/dev/null \
            || { echo "::error::${NAME}: .claude/settings.json has an allow list"; fail=1; }
          for d in 01-collect 02-draft 03-deliver; do
            f="${d}/CONTEXT.md"
            need "$f"
            [ -e "$f" ] || continue
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            grep -qx 'status: stub' "$f" || { echo "::error::${NAME}: ${f} is not status: stub"; fail=1; }
            grep -qF "\`${f}\`" CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to ${f}"; fail=1; }
          done
          gates="$(cat ./*/CONTEXT.md | grep -c '^- \[ \]' || true)"
          [ "$gates" -eq 1 ] || { echo "::error::${NAME}: ${gates} example gates (want 1)"; fail=1; }
          grep -qx '      workspace: true' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml does not pass workspace: true"; fail=1; }
          ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          # A workspace deploys nothing: its README.md has no Environments table.
          ! grep -qx '## Environments' README.md || { echo "::error::${NAME}: a workspace README.md has an Environments section"; fail=1; }
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github ./*/CONTEXT.md \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          exit "$fail"
      - name: session-start.sh prints the board of a fixture
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A copy of the render, with no setup stub, gets two epics, one triage stub, an Order
        # and two branches. The hook must print the expected lines, keep the checked-out ticket
        # started, and stay quiet on stderr with no README.md, no .git or no open stub. Then an
        # open setup stub prints on its own, and a done one does not.
        run: |
          fail=0
          b="${RUNNER_TEMP}/board-${NAME}"
          cp -a . "$b"
          cd "$b"
          i=.icm/intake
          rm -rf "$i/setup"
          mkdir -p "$i/zz-alpha" "$i/zz-beta/_done"
          printf '# Breakdown: Zz alpha\n' > "$i/zz-alpha/breakdown.md"
          printf '# Stub: A1\n\n- feature-slug: a1\n- sequence: 2 of 3\n' > "$i/zz-alpha/a1.md"
          printf '# Stub: A2\n\n- feature-slug: a2\n- sequence: 1 of 3\n- blocked: waits on a vendor\n' > "$i/zz-alpha/a2.md"
          printf '# Stub: A3\n\n- feature-slug: a3\n' > "$i/zz-alpha/a3.md"
          printf '# Stub: B1\n\n- feature-slug: b1\n- sequence: 2 of 2\n' > "$i/zz-beta/b1.md"
          printf '# Stub: B0\n\n- feature-slug: b0\n- sequence: 1 of 2\n' > "$i/zz-beta/_done/b0.md"
          printf '# Stub: Zz fix\n\n- lane: bug\n- priority: P1\n' > "$i/triage/zz-fix.md"
          printf '\n## Order\n\nSet by Jamie on 2026-10-27.\n\n1. triage\n2. zz-alpha\n3. zz-beta\n' >> "$i/README.md"
          git init -q -b main
          git config user.name check
          git config user.email check@example.invalid
          git add -A
          git commit -q -m fixture
          # a1 is started. b0 merged and its branch stays: it is not started.
          git branch a1
          git branch b0
          want="$(cat <<'EOF'
          The board of .icm/intake/ (read-only):
            epic zz-alpha: 3 open, next: a1
            epic zz-beta: 1 open, next: b1
            triage: 1 open (bug 1)
          ## Order
          Set by Jamie on 2026-10-27.
          1. triage
          2. zz-alpha
          3. zz-beta
          Started tickets:
            zz-alpha/a1 on branch a1
          5 open stubs in total. Planning lives in .icm/intake/, never in a loose TODO.md.
          EOF
          )"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>"${b}.err")" \
            || { echo "::error::${NAME}: session-start.sh exits non-zero"; fail=1; }
          [ "$got" = "$want" ] || { echo "::error::${NAME}: session-start.sh prints other lines"; diff <(echo "$want") <(echo "$got"); fail=1; }
          # On the ticket's branch the stub is in _done/, and the ticket stays started.
          git switch -q a1
          mkdir -p "$i/zz-alpha/_done"
          git mv "$i/zz-alpha/a1.md" "$i/zz-alpha/_done/a1.md"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")"
          grep -qxF '  zz-alpha/a1 on branch a1' <<<"$got" || { echo "::error::${NAME}: the checked-out ticket is not started"; fail=1; }
          grep -qxF '  epic zz-alpha: 2 open, next: a3' <<<"$got" || { echo "::error::${NAME}: the next stub on the branch is wrong"; fail=1; }
          # No README.md and no .git: the board still prints, with no error.
          rm -rf .git "$i/README.md"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")" \
            || { echo "::error::${NAME}: session-start.sh fails with no .git"; fail=1; }
          ! grep -qF 'Started' <<<"$got" || { echo "::error::${NAME}: a ticket is started with no .git"; fail=1; }
          ! grep -qxF '## Order' <<<"$got" || { echo "::error::${NAME}: an Order prints with no README.md"; fail=1; }
          # No open stub: silent.
          rm -rf "$i/zz-alpha" "$i/zz-beta" "$i/triage/zz-fix.md"
          [ -z "$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")" ] \
            || { echo "::error::${NAME}: session-start.sh prints with no open stub"; fail=1; }
          # An open setup stub prints with no ticket open, and does not count as a stub.
          mkdir -p "$i/setup/_done"
          printf '# Setup: Zz act\n\n- setup-slug: zz-act\n' > "$i/setup/zz-act.md"
          printf '> Done: Jamie, 2026-10-28\n# Setup: Zz old\n' > "$i/setup/_done/zz-old.md"
          want="$(printf '%s\n' 'The board of .icm/intake/ (read-only):' \
            '  setup: open acts for a person: zz-act (.icm/intake/setup/)' \
            '0 open stubs in total. Planning lives in .icm/intake/, never in a loose TODO.md.')"
          got="$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")"
          [ "$got" = "$want" ] || { echo "::error::${NAME}: session-start.sh prints other lines for a setup stub"; diff <(echo "$want") <(echo "$got"); fail=1; }
          rm "$i/setup/zz-act.md"
          [ -z "$(CLAUDE_PROJECT_DIR="$b" bash .claude/hooks/session-start.sh 2>>"${b}.err")" ] \
            || { echo "::error::${NAME}: session-start.sh prints a done setup stub"; fail=1; }
          [ ! -s "${b}.err" ] || { echo "::error::${NAME}: session-start.sh writes to stderr"; cat "${b}.err"; fail=1; }
          exit "$fail"
      - name: new-run.sh --dry-run changes nothing
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The rendered folder becomes a git repo with one fixture stub committed. A gh that exits
        # 99 goes first on PATH, so a dry run that calls gh fails here. Then a triage stub stays
        # untracked, as a lane leaves it, for a dry run with --ready.
        run: |
          fail=0
          git init -q -b main
          git config user.name check
          git config user.email check@example.invalid
          git add -A
          git commit -q -m render
          mkdir -p .icm/intake/zz-epic
          cat > .icm/intake/zz-epic/zz-stub.md <<'EOF'
          # Stub: Zz proof stub

          - feature-slug: zz-stub
          - epic: zz-epic
          - sequence: 1 of 1
          - depends-on: none
          - complexity: medium
          - priority: P2

          ## Problem

          The proof needs a stub.

          ## Acceptance criteria

          - [ ] zz criterion one
          - [ ] zz criterion two

          ## Out of scope

          - Nothing.
          EOF
          git add .icm/intake/zz-epic/zz-stub.md
          git commit -q -m stub
          nogh="${RUNNER_TEMP}/nogh-${NAME}"
          mkdir -p "$nogh"
          printf '#!/bin/sh\necho "gh was called" >&2\nexit 99\n' > "${nogh}/gh"
          chmod +x "${nogh}/gh"
          before="$(git rev-parse HEAD)"
          out="$(PATH="${nogh}:${PATH}" bash .icm/scripts/new-run.sh zz-epic/zz-stub --dry-run)" \
            || { echo "::error::${NAME}: the dry run of zz-epic/zz-stub failed"; fail=1; }
          for l in 'branch: zz-stub' 'pull request: draft' '<!-- gate:spec-approved -->' \
            '- ticket: `.icm/intake/zz-epic/zz-stub.md`' '- [ ] zz criterion one' '- [ ] zz criterion two'; do
            grep -qxF -- "$l" <<<"$out" || { echo "::error::${NAME}: the dry run does not print '${l}'"; fail=1; }
          done
          [ -z "$(git status --porcelain)" ] || { echo "::error::${NAME}: the dry run changed the working tree"; fail=1; }
          [ "$(git rev-parse HEAD)" = "$before" ] || { echo "::error::${NAME}: the dry run made a commit"; fail=1; }
          ! git show-ref --verify --quiet refs/heads/zz-stub || { echo "::error::${NAME}: the dry run made a branch"; fail=1; }
          cat > .icm/intake/triage/zz-fix.md <<'EOF'
          # Stub: Zz proof fix

          - lane: hotfix
          - found-by: check.yml · 2026-10-27
          - complexity: low
          - priority: P0

          ## Problem

          The proof needs a triage stub.

          ## Proposed change

          None.

          ## Acceptance criteria

          - [ ] zz fix criterion
          EOF
          st="$(git status --porcelain --untracked-files=all)"
          out="$(PATH="${nogh}:${PATH}" bash .icm/scripts/new-run.sh triage/zz-fix --ready --dry-run)" \
            || { echo "::error::${NAME}: the dry run of triage/zz-fix failed"; fail=1; }
          for l in 'branch: triage/zz-fix' 'pull request: ready' '- [ ] zz fix criterion'; do
            grep -qxF -- "$l" <<<"$out" || { echo "::error::${NAME}: the triage dry run does not print '${l}'"; fail=1; }
          done
          ! grep -qF 'Spec approved' <<<"$out" || { echo "::error::${NAME}: the triage dry run keeps the Spec approved gate"; fail=1; }
          [ "$(git status --porcelain --untracked-files=all)" = "$st" ] || { echo "::error::${NAME}: the triage dry run changed the working tree"; fail=1; }
          exit "$fail"
      - name: merge.sh uses the REST API and keeps each refusal
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A fake gh goes first on PATH. It serves fixture JSON for each REST path and logs each
        # call. It exits 99 on a call that is not `gh api`, and 98 on a path it does not know. The
        # base pull request is ticked, green and clean. Each refusal case changes one field. The
        # check runs hold an older failed run of `ci`, so only the latest run per name counts.
        run: |
          fail=0
          fake="${RUNNER_TEMP}/fakegh-${NAME}"
          mkdir -p "${fake}/bin"
          cat > "${fake}/bin/gh" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "${FAKE}/calls"
          [ "${1:-}" = api ] || { echo "not gh api: $*" >&2; exit 99; }
          shift
          method=GET
          path=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -X) method="$2"; shift 2 ;;
              -f | -F) shift 2 ;;
              --paginate) shift ;;
              -*) echo "unknown flag: $1" >&2; exit 99 ;;
              *) path="$1"; shift ;;
            esac
          done
          case "${method} ${path}" in
            "GET repos/zz/proof/pulls/7") cat "${FAKE}/pr.json" ;;
            "GET repos/zz/proof/commits/abc123/check-runs?per_page=100") cat "${FAKE}/runs.json" ;;
            "GET repos/zz/proof/commits/abc123/status") cat "${FAKE}/status.json" ;;
            "PUT repos/zz/proof/pulls/7/merge") echo '{"sha":"feedface","merged":true}' ;;
            "DELETE repos/zz/proof/git/refs/heads/zz-branch") ;;
            *) echo "unexpected: ${method} ${path}" >&2; exit 98 ;;
          esac
          EOF
          chmod +x "${fake}/bin/gh"
          pr='{"number":7,"title":"fix: zz","state":"open","merged":false,"draft":false,"mergeable":true,"mergeable_state":"clean",
            "body":"### Gates\r\n\r\n<!-- gate:ready-to-merge -->\r\n- [x] **Ready to merge** — Jamie ticks this.\r\n",
            "head":{"ref":"zz-branch","sha":"abc123","repo":{"full_name":"zz/proof"}}}'
          runs='{"check_runs":[{"id":1,"name":"ci","status":"completed","conclusion":"failure","output":{"title":null}},
            {"id":2,"name":"ci","status":"completed","conclusion":"success","output":{"title":null}},
            {"id":3,"name":"gate","status":"completed","conclusion":"skipped","output":{"title":null}}]}'
          status='{"statuses":[{"id":1,"context":"Vercel","state":"success","description":"Deployment has completed"}]}'
          # run_case <label> <pr filter> <runs filter> <status filter> <exit> <text>
          run_case() {
            rm -f "${fake}/calls"
            jq "$2" <<<"$pr" > "${fake}/pr.json"
            jq "$3" <<<"$runs" > "${fake}/runs.json"
            jq "$4" <<<"$status" > "${fake}/status.json"
            code=0
            out="$(FAKE="$fake" GH_REPO=zz/proof PATH="${fake}/bin:${PATH}" bash .icm/scripts/merge.sh 7 2>&1)" || code=$?
            [ "$code" -eq "$5" ] || { echo "::error::${NAME}: merge.sh, ${1}: exit ${code}, not ${5}"; echo "$out"; fail=1; }
            grep -qF -- "$6" <<<"$out" || { echo "::error::${NAME}: merge.sh, ${1}: no line '${6}'"; echo "$out"; fail=1; }
            ! grep -qi graphql "${fake}/calls" || { echo "::error::${NAME}: merge.sh, ${1}: a GraphQL call"; fail=1; }
            if [ "$5" -ne 0 ] && grep -q '^api -X PUT' "${fake}/calls"; then
              echo "::error::${NAME}: merge.sh, ${1}: it merged after a refusal"; fail=1
            fi
          }
          run_case unticked '.body |= sub("\\[x\\]"; "[ ]")' . . 1 '#7: Ready to merge has no tick. Jamie ticks it'
          run_case draft '.draft = true' . . 1 '#7: the pull request is a draft'
          run_case closed '.state = "closed"' . . 1 '#7: the state is CLOSED, not open'
          run_case merged '.state = "closed" | .merged = true' . . 1 '#7: the state is MERGED, not open'
          run_case 'no check' . '.check_runs = []' '.statuses = []' 1 '#7: no check ran'
          run_case 'a pending run' . '.check_runs[1].status = "in_progress"' . 1 '#7: the check ci is pending'
          run_case 'a failed status' . . '.statuses[0].state = "failure"' 1 '#7: the check Vercel is failure'
          run_case conflict '.mergeable = false' . . 1 '#7: the branch zz-branch conflicts with main'
          run_case dirty '.mergeable_state = "dirty"' . . 1 '#7: the branch zz-branch conflicts with main'
          run_case clean . . . 0 'merge commit: feedface'
          for l in 'api -X PUT repos/zz/proof/pulls/7/merge -f merge_method=squash -f sha=abc123 -f commit_title=fix: zz (#7)' \
            'api -X DELETE repos/zz/proof/git/refs/heads/zz-branch'; do
            grep -qxF -- "$l" "${fake}/calls" || { echo "::error::${NAME}: merge.sh, clean: no call '${l}'"; cat "${fake}/calls"; fail=1; }
          done
          grep -qxF 'branch deleted: zz-branch' <<<"$out" || { echo "::error::${NAME}: merge.sh, clean: no deleted branch"; fail=1; }
          run_case 'mergeable not computed' '.mergeable = null' . . 0 'merge commit: feedface'
          [ "$(grep -cxF 'api repos/zz/proof/pulls/7' "${fake}/calls")" -eq 2 ] \
            || { echo "::error::${NAME}: merge.sh does not read the pull request again when mergeable is null"; fail=1; }
          exit "$fail"
      - name: rollback.sh finds the UAT projects and acts on each one
        if: matrix.name == 'all'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A fake curl goes first on PATH. It reads the config file that lib/vercel.sh writes,
        # serves fixture JSON for each path, logs each call, and exits 98 on a path it does not
        # know. The team holds four projects. app and admin are linked to the repository and
        # have `uat`. marketing is linked and has no `uat`. other is linked to another
        # repository.
        run: |
          fail=0
          fake="${RUNNER_TEMP}/fakeapi"
          mkdir -p "${fake}/bin"
          cat > "${fake}/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          cfg=""
          while [ $# -gt 0 ]; do case "$1" in --config) cfg="$2"; shift 2 ;; *) shift ;; esac; done
          [ -n "$cfg" ] || { echo "fake curl: no --config" >&2; exit 99; }
          url="$(sed -nE 's/^url = "(.*)"$/\1/p' "$cfg")"
          method="$(sed -nE 's/^request = "(.*)"$/\1/p' "$cfg")"
          path="${url#https://api.vercel.com}"
          path="$(sed -E 's/[?&]slug=zz$//' <<<"$path")"
          printf '%s %s\n' "$method" "$path" >> "${FAKE}/calls"
          ok() { printf '%s\n200' "$1"; exit 0; }
          uat='{"environments":[{"slug":"uat","branchMatcher":{"type":"equals","pattern":"main"},"domains":[{"name":"uat.zz.test"}]}]}'
          case "${method} ${path}" in
            "GET /v10/projects?repoUrl=https%3A%2F%2Fgithub.com%2Fzz%2Fproof&limit=100")
              ok '{"projects":[{"id":"prj_app","name":"app","link":{"org":"zz","repo":"proof"}},
                {"id":"prj_admin","name":"admin","link":{"org":"zz","repo":"proof"}},
                {"id":"prj_web","name":"marketing","link":{"org":"zz","repo":"proof"}},
                {"id":"prj_x","name":"other","link":{"org":"zz","repo":"other"}}]}' ;;
            "GET /v9/projects/prj_app/custom-environments" | "GET /v9/projects/prj_admin/custom-environments") ok "$uat" ;;
            "GET /v9/projects/prj_web/custom-environments") ok '{"environments":[]}' ;;
            "GET /v9/projects/prj_app" | "GET /v9/projects/prj_admin")
              p="${path##*/prj_}"; ok "{\"id\":\"prj_${p}\",\"name\":\"${p}\",\"targets\":{\"production\":{\"id\":\"dpl_${p}2\"}}}" ;;
            "GET /v6/deployments?projectId=prj_app&target=production&limit=20" | "GET /v6/deployments?projectId=prj_admin&target=production&limit=20")
              p="${path#*prj_}"; p="${p%%&*}"
              ok "{\"deployments\":[{\"uid\":\"dpl_${p}2\",\"url\":\"${p}-2.vercel.app\",\"state\":\"READY\",\"created\":2000,\"meta\":{\"githubCommitSha\":\"bbbbbbb\"}},
                {\"uid\":\"dpl_${p}1\",\"url\":\"${p}-1.vercel.app\",\"state\":\"READY\",\"created\":1000,\"meta\":{\"githubCommitSha\":\"aaaaaaa\"}}]}" ;;
            *) echo "unexpected: ${method} ${path}" >&2; exit 98 ;;
          esac
          EOF
          chmod +x "${fake}/bin/curl"
          # run_script <label> <exit> <text> <command...>
          run_script() {
            local label="$1" want="$2" text="$3" code=0
            shift 3
            rm -f "${fake}/calls"
            out="$(FAKE="$fake" GH_REPO=zz/proof VERCEL_TEAM=zz VERCEL_TOKEN=fake \
              PATH="${fake}/bin:${PATH}" "$@" 2>&1)" || code=$?
            [ "$code" -eq "$want" ] || { echo "::error::${NAME}: ${label}: exit ${code}, not ${want}"; echo "$out"; fail=1; }
            grep -qxF -- "$text" <<<"$out" || { echo "::error::${NAME}: ${label}: no line '${text}'"; echo "$out"; fail=1; }
            # marketing is read once, for its custom environments. No other call names it or other.
            bad="$(grep -E 'prj_web|prj_x' "${fake}/calls" 2>/dev/null | grep -vxF 'GET /v9/projects/prj_web/custom-environments' || true)"
            [ -z "$bad" ] || { echo "::error::${NAME}: ${label}: a call reached a project that is not a UAT project: ${bad}"; fail=1; }
          }
          run_script rollback.sh 0 'RESULT: PREPARED dpl_admin1 dpl_app1' bash .icm/scripts/rollback.sh
          for c in 'vercel rollback admin-1.vercel.app --scope zz' 'vercel rollback app-1.vercel.app --scope zz'; do
            grep -qxF "  ${c}" <<<"$out" || { echo "::error::${NAME}: rollback.sh: no command '${c}'"; echo "$out"; fail=1; }
          done
          [ "$(grep -c '^  vercel rollback' <<<"$out")" -eq 2 ] || { echo "::error::${NAME}: rollback.sh: not two commands"; fail=1; }
          exit "$fail"
      - name: vercel-build.sh migrates on the right environments
        if: matrix.database == 'neon'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A fake npm goes first on PATH and logs each call with the DATABASE_URL it got. Each
        # build migrates its own database with the direct string, then builds. With UAT,
        # production only builds. No VERCEL_TARGET_ENV, or no DATABASE_URL on a build that
        # migrates, stops the build before any call.
        run: |
          fail=0
          fake="${RUNNER_TEMP}/fakenpm"
          mkdir -p "${fake}/bin"
          printf '#!/usr/bin/env bash\necho "$* ${DATABASE_URL:-none}" >> "${FAKE_LOG}"\n' > "${fake}/bin/npm"
          chmod +x "${fake}/bin/npm"
          # build <label> <exit> <calls> <env...>: run the script with the env, and count the npm calls.
          build() {
            local label="$1" want="$2" calls="$3" code=0 n out
            shift 3
            rm -f "${fake}/log"
            out="$(env -u VERCEL_TARGET_ENV -u DATABASE_URL -u DATABASE_URL_UNPOOLED -u npm_config_user_agent \
              FAKE_LOG="${fake}/log" PATH="${fake}/bin:${PATH}" "$@" bash .icm/scripts/vercel-build.sh echo built 2>&1)" || code=$?
            [ "$code" -eq "$want" ] || { echo "::error::${NAME}: ${label}: exit ${code}, not ${want}"; echo "$out"; fail=1; }
            n=0; [ ! -e "${fake}/log" ] || n="$(wc -l < "${fake}/log")"
            [ "$n" -eq "$calls" ] || { echo "::error::${NAME}: ${label}: ${n} npm calls, not ${calls}"; echo "$out"; fail=1; }
            if [ "$calls" -gt 0 ]; then
              grep -qx 'run db:migrate direct' "${fake}/log" && grep -qx 'run db:verify direct' "${fake}/log" \
                || { echo "::error::${NAME}: ${label}: db:migrate and db:verify do not get the direct string"; cat "${fake}/log"; fail=1; }
            fi
            if [ "$want" -eq 0 ]; then
              grep -qx built <<<"$out" || { echo "::error::${NAME}: ${label}: the build command did not run"; fail=1; }
            fi
          }
          urls=(DATABASE_URL=pooled DATABASE_URL_UNPOOLED=direct)
          build 'no VERCEL_TARGET_ENV' 1 0 "${urls[@]}"
          build 'preview' 0 2 VERCEL_TARGET_ENV=preview "${urls[@]}"
          build 'preview with no DATABASE_URL' 1 0 VERCEL_TARGET_ENV=preview
          if [ "$UAT" = true ]; then
            build 'uat' 0 2 VERCEL_TARGET_ENV=uat "${urls[@]}"
            build 'production with UAT' 0 0 VERCEL_TARGET_ENV=production "${urls[@]}"
          else
            build 'production without UAT' 0 2 VERCEL_TARGET_ENV=production "${urls[@]}"
          fi
          exit "$fail"
      - name: A monorepo migrates from vercel.json, before turbo starts
        if: matrix.monorepo == 'true' && matrix.database == 'neon'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The buildCommand line of .icm/database/CONTEXT.md runs in apps/web of a fixture
        # Turborepo whose turbo.json names no variable, with the root node_modules/.bin on PATH,
        # as on Vercel. The script migrates and verifies with the direct string, then turbo
        # builds. Strict mode keeps DATABASE_URL from the build task, so the build logs none.
        # With UAT, production only builds. A buildCommand has no npm_config_user_agent, so with
        # a pnpm lockfile at the root the script calls pnpm.
        env:
          TURBO_VERSION: 2.9.18
        run: |
          fail=0
          f=.icm/database/CONTEXT.md
          cmd="$(sed -n 's/.*`"buildCommand": "\(.*\)"`.*/\1/p' "$f")"
          [ -n "$cmd" ] && [ "$(wc -l <<<"$cmd")" -eq 1 ] \
            || { echo "::error::${NAME}: ${f} does not have one buildCommand line"; exit 1; }
          echo "buildCommand: ${cmd}"
          mono="${RUNNER_TEMP}/mono"
          mkdir -p "${mono}/.icm/scripts" "${mono}/apps/web"
          cp .icm/scripts/vercel-build.sh "${mono}/.icm/scripts/"
          printf '{"name":"mono","private":true,"workspaces":["apps/*"],"packageManager":"npm@%s"}\n' \
            "$(npm --version)" > "${mono}/package.json"
          echo '{"tasks":{"build":{"outputs":[]}}}' > "${mono}/turbo.json"
          cat > "${mono}/apps/web/package.json" <<'JSON'
          {
            "name": "web",
            "private": true,
            "scripts": {
              "db:migrate": "echo \"migrate ${DATABASE_URL:-none}\" >> ../../log",
              "db:verify": "echo \"verify ${DATABASE_URL:-none}\" >> ../../log",
              "build": "echo \"build ${DATABASE_URL:-none}\" >> ../../log"
            }
          }
          JSON
          (cd "$mono" && npm install --save-dev --no-audit --no-fund "turbo@${TURBO_VERSION}" >/dev/null)
          # build <label> <exit> <log> <env...>: run the buildCommand in apps/web with the env.
          build() {
            local label="$1" want="$2" log="$3" code=0 out got
            shift 3
            rm -f "${mono}/log"
            out="$(cd "${mono}/apps/web" && env -u VERCEL_TARGET_ENV -u DATABASE_URL -u DATABASE_URL_UNPOOLED \
              -u npm_config_user_agent PATH="${mono}/node_modules/.bin:${PATH}" TURBO_FORCE=true \
              TURBO_TELEMETRY_DISABLED=1 "$@" bash -c "$cmd" 2>&1)" || code=$?
            got="$(cat "${mono}/log" 2>/dev/null || true)"
            [ "$code" -eq "$want" ] || { echo "::error::${NAME}: ${label}: exit ${code}, not ${want}"; echo "$out"; fail=1; }
            [ "$got" = "$log" ] || { echo "::error::${NAME}: ${label}: log '${got//$'\n'/; }', not '${log//$'\n'/; }'"; echo "$out"; fail=1; }
          }
          urls=(DATABASE_URL=pooled DATABASE_URL_UNPOOLED=direct)
          migrated=$'migrate direct\nverify direct\nbuild none'
          build 'no VERCEL_TARGET_ENV' 1 '' "${urls[@]}"
          build 'preview' 0 "$migrated" VERCEL_TARGET_ENV=preview "${urls[@]}"
          if [ "$UAT" = true ]; then
            build 'uat' 0 "$migrated" VERCEL_TARGET_ENV=uat "${urls[@]}"
            build 'production with UAT' 0 'build none' VERCEL_TARGET_ENV=production "${urls[@]}"
          else
            build 'production without UAT' 0 "$migrated" VERCEL_TARGET_ENV=production "${urls[@]}"
          fi
          # The pnpm lockfile decides the package manager. A fake pnpm logs each call.
          pn="${RUNNER_TEMP}/mono-pnpm"
          mkdir -p "${pn}/.icm/scripts" "${pn}/apps/web" "${pn}/bin"
          cp .icm/scripts/vercel-build.sh "${pn}/.icm/scripts/"
          : > "${pn}/pnpm-lock.yaml"
          printf '#!/usr/bin/env bash\necho "pnpm $*" >> "%s/log"\n' "$pn" > "${pn}/bin/pnpm"
          chmod +x "${pn}/bin/pnpm"
          (cd "${pn}/apps/web" && env -u npm_config_user_agent PATH="${pn}/bin:${PATH}" VERCEL_TARGET_ENV=preview \
            DATABASE_URL=pooled bash ../../.icm/scripts/vercel-build.sh true) \
            || { echo "::error::${NAME}: the pnpm build failed"; fail=1; }
          [ "$(cat "${pn}/log" 2>/dev/null)" = $'pnpm run db:migrate\npnpm run db:verify' ] \
            || { echo "::error::${NAME}: with a pnpm lockfile, the script does not call pnpm"; cat "${pn}/log"; fail=1; }
          exit "$fail"
      - name: The router passes its fixture test
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The test builds its own fixture trees, so the rendered build's .icm/intake/ does not
        # count. Each hook call must take less than 100 ms.
        run: bash .claude/hooks/route-request.test.sh
      - name: The git-writes guard asks before a REST merge or ref delete
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The hook reads the command that the session types. merge.sh calls the same REST
        # paths, but the hook does not see them, so the script stays allowed. A PATCH on a
        # ref and a POST on /merges also ask, and a /merges call with a field and no method
        # asks, because gh api sends it as a POST.
        run: |
          fail=0
          decide() {
            jq -nc --arg c "$1" '{tool_input: {command: $c}, cwd: "."}' \
              | env -u CLAUDE_PROJECT_DIR bash .claude/hooks/confirm-git-writes.sh \
              | jq -r '.hookSpecificOutput.permissionDecision // empty'
          }
          for c in 'gh api -X PUT repos/o/r/pulls/7/merge' \
            'gh api -X DELETE repos/o/r/git/refs/heads/x' \
            'gh api --method=PUT "repos/o/r/pulls/7/merge" -f merge_method=squash' \
            'gh api repos/o/r/pulls/7/merge -f sha=abc -XPUT' \
            'cd x && gh api --method delete repos/o/r/git/refs/heads/x' \
            'gh api -X PATCH repos/o/r/git/refs/heads/x -F sha=abc -F force=true' \
            'gh api repos/o/r/git/refs/heads/x -F sha=abc --method=patch' \
            'gh api -X POST repos/o/r/merges -f base=main -f head=x' \
            'gh api "repos/o/r/merges" -f base=main -f head=x -XPOST' \
            'gh api repos/o/r/merges -f base=main -f head=x' \
            'gh api -X GET repos/o/r/pulls && gh api repos/o/r/merges --field base=main'; do
            [ "$(decide "$c")" = ask ] || { echo "::error::${NAME}: no ask for '${c}'"; fail=1; }
          done
          for c in '.icm/scripts/merge.sh 7' 'gh api repos/o/r/pulls/7' \
            'gh api repos/o/r/pulls/7/merge' 'gh api -X GET repos/o/r/git/refs/heads/x' \
            'gh api -X PUT repos/o/r/merges' 'gh api repos/o/r/git/refs/heads/x' \
            'gh api -X GET repos/o/r/merges' 'gh api repos/o/r/merges' \
            'gh api -X GET repos/o/r/merges -f per_page=5'; do
            [ -z "$(decide "$c")" ] || { echo "::error::${NAME}: an ask for '${c}'"; fail=1; }
          done
          exit "$fail"
      - name: actionlint on the rendered workflows
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The rendered folder is not a git repo, so the files are named instead of found.
        run: |
          "${GITHUB_WORKSPACE}/actionlint" -color .github/workflows/*.yml
      - name: shellcheck on the rendered hooks and scripts
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A workspace has no .icm/scripts: only the folders the render has are read.
        run: |
          dirs=(.claude/hooks)
          [ -d .icm/scripts ] && dirs+=(.icm/scripts)
          find "${dirs[@]}" -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  update:
    # copier update from an older tag to HEAD, as a live repo takes a new tag. from-v0.6.0 starts
    # in the layout of templates/{{ tier }}. from-v0.8.0 starts in the bank before workspace and
    # database, with UAT, and updates to neon. copier renders the old tag with the old answers
    # and HEAD with the new answers, and applies the difference. After the update: no conflict
    # marker remains, _commit is HEAD's, the files equal a fresh HEAD render with the same
    # answers in content and executable bit, no file of the old render stays that HEAD does not
    # render, and each written-once file keeps the old render's content. A failure names the
    # file. The tag v1.0.0 waits on this job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: from-v0.6.0
            ref: v0.6.0
            old_answers: tier=app
            new_answers: workspace=false monorepo=false release=true uat=false database=none
          - name: from-v0.8.0
            ref: v0.8.0
            old_answers: monorepo=false release=true uat=true
            new_answers: workspace=false monorepo=false release=true uat=true database=neon
    env:
      NAME: ${{ matrix.name }}
      REF: ${{ matrix.ref }}
      OLD_ANSWERS: slug=zz client_name=Zz language=en ${{ matrix.old_answers }}
      NEW_ANSWERS: slug=zz client_name=Zz language=en ${{ matrix.new_answers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # copier reads the tags. Nothing is written into this folder, so copier sees a clean
          # template.
          fetch-depth: 0
          persist-credentials: false
      - name: Install copier
        # The version of the render job.
        run: pipx install copier==9.19.1
      - name: Render the old tag and commit it
        # The source is an absolute path: copier update reads it from _src_path and runs in
        # the rendered folder. copier update refuses a folder that is not a clean git repo.
        run: |
          d=()
          for a in $OLD_ANSWERS; do d+=(-d "$a"); done
          old="${RUNNER_TEMP}/old"
          copier copy --defaults --vcs-ref "$REF" "${d[@]}" "$GITHUB_WORKSPACE" "$old"
          cp -a "$old" "${RUNNER_TEMP}/snapshot"
          git -C "$old" init -q -b main
          git -C "$old" config user.name check
          git -C "$old" config user.email check@example.invalid
          git -C "$old" add -A
          git -C "$old" commit -q -m "render ${REF}"
      - name: Update to HEAD
        working-directory: ${{ runner.temp }}/old
        run: |
          d=()
          for a in $NEW_ANSWERS; do d+=(-d "$a"); done
          copier update --defaults --vcs-ref HEAD --conflict inline "${d[@]}"
      - name: Render HEAD with the same answers
        # The reference.
        run: |
          d=()
          for a in $NEW_ANSWERS; do d+=(-d "$a"); done
          copier copy --defaults --vcs-ref HEAD "${d[@]}" "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/ref"
      - name: The update equals a fresh HEAD render
        run: |
          fail=0
          up="${RUNNER_TEMP}/old"
          ref="${RUNNER_TEMP}/ref"
          snap="${RUNNER_TEMP}/snapshot"
          err() { echo "::error::${NAME}: $1"; fail=1; }
          # The written-once files. Each name must be in _skip_if_exists, with its Jinja
          # condition removed, so a change to that list fails here.
          once=(README.md .icm/intake/README.md CLAUDE.md .gitignore .env.example)
          skip="$(yq '._skip_if_exists[]' copier.yml | sed -E 's/\{%[^%]*%\}//g')"
          for f in "${once[@]}"; do
            grep -qxF "$f" <<<"$skip" || { echo "::error file=copier.yml::${NAME}: _skip_if_exists does not name ${f}"; fail=1; }
          done
          # A written-once file that the old render has stays as it was, and is not compared
          # with HEAD. One that the old render does not have is compared like any other file.
          kept=()
          for f in "${once[@]}"; do
            if [ -e "${snap}/${f}" ]; then kept+=("$f"); fi
          done
          for f in "${kept[@]}"; do
            if [ ! -e "${up}/${f}" ]; then
              err "the update deleted the written-once file ${f}"
            elif ! cmp -s "${snap}/${f}" "${up}/${f}"; then
              err "the update changed the written-once file ${f}"
            fi
          done
          echo "Written-once files kept: ${kept[*]}"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "a conflict marker remains in ${f#"${up}/"}"
          done < <(grep -rlE --exclude-dir=.git '^(<<<<<<<|>>>>>>>)' "$up" || true)
          a="$(yq '._commit' "${up}/.copier-answers.yml")"
          b="$(yq '._commit' "${ref}/.copier-answers.yml")"
          if [ -z "$a" ] || [ "$a" = null ] || [ "$a" != "$b" ]; then
            err ".copier-answers.yml has _commit '${a}', and a HEAD render has '${b}'"
          fi
          # Paths, not diff -r -x: diff -x README.md also skips each other README.md, such as
          # the one in .claude/skills/asd-ste100/.
          out="$(printf '%s\n' .copier-answers.yml "${kept[@]}")"
          files() {
            (cd "$1" && find . -path ./.git -prune -o \( -type f -o -type l \) -print) \
              | sed 's|^\./||' | grep -vxFf <(echo "$out") | LC_ALL=C sort || true
          }
          fu="$(files "$up")"
          fr="$(files "$ref")"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "${f} is a file of the old render that HEAD does not render"
          done < <(LC_ALL=C comm -23 <(echo "$fu") <(echo "$fr"))
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            err "${f} is a file that the update did not render"
          done < <(LC_ALL=C comm -13 <(echo "$fu") <(echo "$fr"))
          n=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            n=$((n + 1))
            echo "compare ${f}"
            if ! cmp -s "${up}/${f}" "${ref}/${f}"; then
              err "${f} is not the same as in a fresh HEAD render"
              diff -u "${ref}/${f}" "${up}/${f}" | head -n 40 || true
            fi
            xu=no; xr=no
            if [ -x "${up}/${f}" ]; then xu=yes; fi
            if [ -x "${ref}/${f}" ]; then xr=yes; fi
            [ "$xu" = "$xr" ] || err "${f} is executable: ${xu} after the update, ${xr} in a fresh HEAD render"
          done < <(LC_ALL=C comm -12 <(echo "$fu") <(echo "$fr"))
          echo "Compared ${n} files."
          [ "$n" -gt 0 ] || err "no file was compared"
          exit "$fail"
      - name: A done setup stub stays done, and a new answer adds its stubs
        if: matrix.name == 'from-v0.8.0'
        # A HEAD render with neon and no UAT, in git. A person moves neon-projects to
        # setup/_done/. Then copier update answers uat yes. The moved stub must not come back,
        # and the UAT acts must arrive open.
        run: |
          fail=0
          u="${RUNNER_TEMP}/setup-update"
          st=.icm/intake/setup
          copier copy --defaults --vcs-ref HEAD -d slug=zz -d client_name=Zz -d language=en \
            -d uat=false -d database=neon "$GITHUB_WORKSPACE" "$u"
          git -C "$u" init -q -b main
          git -C "$u" config user.name check
          git -C "$u" config user.email check@example.invalid
          git -C "$u" add -A
          git -C "$u" commit -q -m render
          [ -e "${u}/${st}/neon-projects.md" ] || { echo "::error::the neon render has no ${st}/neon-projects.md"; exit 1; }
          [ ! -e "${u}/${st}/vercel-uat-environment.md" ] || { echo "::error::a render without UAT has a UAT setup stub"; fail=1; }
          mkdir -p "${u}/${st}/_done"
          git -C "$u" mv "${st}/neon-projects.md" "${st}/_done/neon-projects.md"
          git -C "$u" commit -q -m "setup: neon-projects done"
          (cd "$u" && copier update --defaults --vcs-ref HEAD --conflict inline -d uat=true)
          [ ! -e "${u}/${st}/neon-projects.md" ] || { echo "::error::copier update wrote the done stub neon-projects again"; fail=1; }
          [ -e "${u}/${st}/_done/neon-projects.md" ] || { echo "::error::copier update removed the done stub neon-projects"; fail=1; }
          for a in vercel-uat-environment actions-vercel uat-variables actions-production-database uat-database; do
            [ -e "${u}/${st}/${a}.md" ] || { echo "::error::the answer uat yes did not add the open stub ${a}"; fail=1; }
          done
          exit "$fail"

  ste:
    # The template's asd-ste100 is a copy of the linter's repo at STE_SKILL_SHA, and no file in
    # it is edited. A difference fails here and shows the diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the skill at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill "${RUNNER_TEMP}/ste"
          git -C "${RUNNER_TEMP}/ste" checkout -q "$STE_SKILL_SHA"
      - name: The vendored copy equals the pinned commit
        run: |
          diff -r -x .git "${RUNNER_TEMP}/ste" "template/.claude/skills/{% if not workspace %}asd-ste100{% endif %}" \
            || { echo "::error::the vendored asd-ste100 is not the same as ${STE_SKILL_SHA}"; exit 1; }

  questions:
    # Every functionality question (type bool) carries a default and a help line, so a kickoff
    # can answer with the defaults and a reader knows what yes buys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each bool question has a default and a help line
        run: |
          fail=0
          while IFS= read -r q; do
            [ -n "$q" ] || continue
            yq -e ".\"$q\" | has(\"default\") and has(\"help\")" copier.yml >/dev/null 2>&1 \
              || { echo "::error file=copier.yml::question $q lacks a default or a help line"; fail=1; }
            echo "$q: default $(yq ".\"$q\".default" copier.yml)"
          done < <(yq 'to_entries | .[] | select(.value | type == "!!map" and .type == "bool") | .key' copier.yml)
          exit "$fail"

  writing:
    # Simplified Technical English as advice: every finding in the job log and in the run
    # summary, never a failure.
    # The same linter commit as the house's check.yml. The template's copy of the linter's repo
    # is skipped: its examples hold bad text on purpose, and no file in the copy is edited.
    # STE_SKILL_SHA is in the workflow's env, so the ste job reads the same commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the linter at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill /tmp/ste
          git -C /tmp/ste checkout -q "$STE_SKILL_SHA"
      - name: Lint every markdown file, as advice
        run: |
          out="$(git ls-files -z '*.md' '*.md.jinja' ':!:template/.claude/skills/*asd-ste100*' | xargs -0 python3 -I /tmp/ste/scripts/ste-lint.py 2>&1 || true)"
          { echo '## Simplified Technical English (advice)'; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
