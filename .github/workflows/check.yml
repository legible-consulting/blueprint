# check: the blueprint's walk test. Four proof answer sets render on each pull request and on
# each push to main (three builds and one workspace), the rendered workflows, hooks and scripts are linted, and every
# functionality question is checked for a default and a help line (CI is truth; never run
# locally).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Public repo, but the scan still runs here: nothing client-specific may enter the method.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .

  render:
    # The template renders into a scratch folder with copier, as a kickoff would, once per
    # proof answer set: every default, every yes (monorepo, release, uat), release no, and a
    # workspace. A build must carry the ticket convention, the pull request template with both
    # gate anchors, a CLAUDE.md under 80 lines and no BUILD.md. A uat render carries every UAT
    # file and the others none. A workspace carries the three stage contracts, each with
    # Inputs, Process, Outputs and status: stub, one gate, and a ci.yml that asks for the
    # contract check, and no build file. actionlint reads the rendered workflows and shellcheck the rendered
    # hooks and scripts, so a template error fails here and not in a client repo.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: defaults, workspace: "false", monorepo: "false", release: "true", uat: "false" }
          - { name: all, workspace: "false", monorepo: "true", release: "true", uat: "true" }
          - { name: minimal, workspace: "false", monorepo: "false", release: "false", uat: "false" }
          - { name: workspace, workspace: "true", monorepo: "false", release: "false", uat: "false" }
    env:
      NAME: ${{ matrix.name }}
      WORKSPACE: ${{ matrix.workspace }}
      MONOREPO: ${{ matrix.monorepo }}
      RELEASE: ${{ matrix.release }}
      UAT: ${{ matrix.uat }}
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install copier and actionlint
        run: |
          pipx install copier==9.19.1
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" actionlint
      - name: Render the answer set
        run: |
          copier copy --defaults --vcs-ref HEAD \
            -d slug=zz-proof -d client_name="Zz Proof" -d language=en -d "workspace=${WORKSPACE}" \
            -d "monorepo=${MONOREPO}" -d "release=${RELEASE}" -d "uat=${UAT}" \
            . "${RUNNER_TEMP}/zz-${NAME}"
      - name: The rendered settings deny each env file by name
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A glob such as .env.* also matches .env.example, the file the kickoff and the UAT
        # setup tell a session to read. The deny list names each secret env file instead.
        run: |
          fail=0
          deny="$(jq -r '.permissions.deny[]' .claude/settings.json)" \
            || { echo "::error::${NAME}: .claude/settings.json does not parse as JSON"; exit 1; }
          grep -qxF 'Read(./**/.env.local)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list does not name .env.local"; fail=1; }
          ! grep -qF '.env.*)' <<<"$deny" \
            || { echo "::error::${NAME}: the deny list has a .env.* glob, which blocks .env.example"; fail=1; }
          exit "$fail"
      - name: The rendered build keeps the conventions
        if: matrix.workspace == 'false'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .icm/intake/CONTEXT.md
          need .icm/intake/README.md
          need .icm/intake/_done/.gitkeep
          need .icm/intake/triage/_done/.gitkeep
          need .github/pull_request_template.md
          need .icm/scripts/new-run.sh
          need .icm/scripts/close-out.sh
          need .github/workflows/ci.yml
          need .claude/settings.json
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets; do
            need ".claude/hooks/${h}.sh"
          done
          [ ! -e BUILD.md ] || { echo "::error::${NAME}: BUILD.md must not exist"; fail=1; }
          uat_files=".icm/uat/CONTEXT.md .icm/scripts/promote.sh .icm/scripts/uat-db.sh .icm/scripts/rollback.sh .icm/scripts/lib/vercel.sh .icm/scripts/lib/neon.sh .github/workflows/promote.yml .github/workflows/neon-cleanup.yml .env.example"
          for f in $uat_files; do
            if [ "$UAT" = true ]; then
              [ -e "$f" ] || { echo "::error::${NAME}: missing $f"; fail=1; }
            else
              [ ! -e "$f" ] || { echo "::error::${NAME}: $f must not exist"; fail=1; }
            fi
          done
          if [ "$UAT" = true ]; then
            grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to .icm/uat/CONTEXT.md"; fail=1; }
            grep -qF '## Environments' README.md || { echo "::error::${NAME}: README.md has no Environments table"; fail=1; }
          else
            ! grep -qF '.icm/uat/CONTEXT.md' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md routes to .icm/uat/CONTEXT.md"; fail=1; }
          fi
          if [ "$RELEASE" = true ]; then
            grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has no release job"; fail=1; }
          else
            ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          fi
          if [ "$MONOREPO" = true ]; then
            grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore lacks the monorepo caches"; fail=1; }
            grep -qF '## Apps and packages' CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md has no Apps and packages table"; fail=1; }
          else
            ! grep -qxF '.turbo/' .gitignore || { echo "::error::${NAME}: .gitignore carries the monorepo caches"; fail=1; }
          fi
          ! grep -qF 'tier' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes a tier"; fail=1; }
          ! grep -qF 'workspace' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml passes workspace"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          for a in gate:spec-approved gate:ready-to-merge; do
            grep -qF "<!-- ${a} -->" .github/pull_request_template.md \
              || { echo "::error::${NAME}: pull_request_template.md lacks the ${a} anchor"; fail=1; }
          done
          # A Jinja tag opens with two braces or a brace and a percent sign. A GitHub Actions
          # expression opens with a dollar sign and two braces, and stays.
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github .icm \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          exit "$fail"
      - name: The rendered workspace keeps the conventions
        if: matrix.workspace == 'true'
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        run: |
          fail=0
          need() { [ -e "$1" ] || { echo "::error::${NAME}: missing $1"; fail=1; }; }
          never() { [ ! -e "$1" ] || { echo "::error::${NAME}: $1 must not exist"; fail=1; }; }
          need CLAUDE.md
          need README.md
          need .gitignore
          need .copier-answers.yml
          need .github/workflows/ci.yml
          need .claude/settings.json
          for h in block-local-checks confirm-git-writes guard-plaintext-secrets; do
            need ".claude/hooks/${h}.sh"
          done
          # A workspace has no tickets, no pull request template and no release: no build file.
          never .icm
          never .github/pull_request_template.md
          never BUILD.md
          never .env.example
          for d in 01-collect 02-draft 03-deliver; do
            f="${d}/CONTEXT.md"
            need "$f"
            [ -e "$f" ] || continue
            for sec in Inputs Process Outputs; do
              grep -qx "## ${sec}" "$f" || { echo "::error::${NAME}: ${f} lacks '## ${sec}'"; fail=1; }
            done
            grep -qx 'status: stub' "$f" || { echo "::error::${NAME}: ${f} is not status: stub"; fail=1; }
            grep -qF "\`${f}\`" CLAUDE.md || { echo "::error::${NAME}: CLAUDE.md does not route to ${f}"; fail=1; }
          done
          gates="$(cat ./*/CONTEXT.md | grep -c '^- \[ \]' || true)"
          [ "$gates" -eq 1 ] || { echo "::error::${NAME}: ${gates} example gates (want 1)"; fail=1; }
          grep -qx '      workspace: true' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml does not pass workspace: true"; fail=1; }
          ! grep -qF 'release.yml' .github/workflows/ci.yml || { echo "::error::${NAME}: ci.yml has a release job"; fail=1; }
          lines="$(wc -l < CLAUDE.md)"
          [ "$lines" -lt 80 ] || { echo "::error::${NAME}: CLAUDE.md has ${lines} lines (limit 80)"; fail=1; }
          ! grep -rqE '(^|[^$])\{\{|\{%' CLAUDE.md README.md .gitignore .github ./*/CONTEXT.md \
            || { echo "::error::${NAME}: an unrendered Jinja tag remains"; fail=1; }
          exit "$fail"
      - name: actionlint on the rendered workflows
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # The rendered folder is not a git repo, so the files are named instead of found.
        run: |
          "${GITHUB_WORKSPACE}/actionlint" -color .github/workflows/*.yml
      - name: shellcheck on the rendered hooks and scripts
        working-directory: ${{ runner.temp }}/zz-${{ matrix.name }}
        # A workspace has no .icm/scripts: only the folders the render has are read.
        run: |
          dirs=(.claude/hooks)
          [ -d .icm/scripts ] && dirs+=(.icm/scripts)
          find "${dirs[@]}" -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  questions:
    # Every functionality question (type bool) carries a default and a help line, so a kickoff
    # can answer with the defaults and a reader knows what yes buys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each bool question has a default and a help line
        run: |
          fail=0
          while IFS= read -r q; do
            [ -n "$q" ] || continue
            yq -e ".\"$q\" | has(\"default\") and has(\"help\")" copier.yml >/dev/null 2>&1 \
              || { echo "::error file=copier.yml::question $q lacks a default or a help line"; fail=1; }
            echo "$q: default $(yq ".\"$q\".default" copier.yml)"
          done < <(yq 'to_entries | .[] | select(.value | type == "!!map" and .type == "bool") | .key' copier.yml)
          exit "$fail"

  writing:
    # Simplified Technical English as advice: findings in the run summary, never a failure.
    # The same linter commit as the house's check.yml.
    runs-on: ubuntu-latest
    env:
      STE_SKILL_SHA: 3944283c183eea13fe5bd902b572da3b4de8bf44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the linter at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill /tmp/ste
          git -C /tmp/ste checkout -q "$STE_SKILL_SHA"
      - name: Lint every markdown file, as advice
        run: |
          out="$(git ls-files -z '*.md' '*.md.jinja' | xargs -0 python3 -I /tmp/ste/scripts/ste-lint.py 2>&1 || true)"
          { echo '## Simplified Technical English (advice)'; echo; echo '```'; echo "$out" | tail -n 200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | tail -n 40
